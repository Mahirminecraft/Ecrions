name: Minecraft Server with ngrok

on:
  workflow_dispatch:

jobs:
  minecraft-ngrok:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # Set a timeout for the job

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jre-headless curl unzip jq screen

      - name: Download and install ngrok
        run: |
          curl -sL https://bin.equinox.io/c/4VmDzA7iaHb/ngrok-stable-linux-amd64.zip -o ngrok.zip
          unzip ngrok.zip
          chmod +x ngrok
          sudo mv ngrok /usr/local/bin/ngrok
          ngrok version

      - name: Authenticate ngrok
        run: ngrok authtoken ${{ secrets.NGROK_AUTHTOKEN }}

      - name: Download Paper Minecraft
        run: |
          curl -fL -o paper.jar https://api.papermc.io/v2/projects/paper/versions/1.20.4/builds/525/downloads/paper-1.20.4-525.jar
          echo "eula=true" > eula.txt

      - name: Start Minecraft server & ngrok
        id: run-server # Give this step an ID to reference its outputs
        run: |
          # Start the Minecraft server in a detached screen session
          screen -dmS mc-server java -Xms1G -Xmx1G -jar paper.jar nogui

          # Wait for the server to start and ngrok to be ready
          sleep 30

          # Start ngrok TCP tunnel and get the public URL
          ngrok tcp 25565 --log=stdout > ngrok.log 2>&1 &
          sleep 10
          
          NGROK_URL=$(curl --silent http://127.0.0.1:4040/api/tunnels | jq -r '.tunnels[0].public_url')

          if [ -z "$NGROK_URL" ]; then
            echo "Failed to get ngrok URL"
            exit 1
          fi

          echo "Minecraft server is running! Connect with: $NGROK_URL"
          echo "ngrok_url=$NGROK_URL" >> $GITHUB_OUTPUT

      - name: Display ngrok URL
        run: |
          echo "The Minecraft server is now publicly accessible via this URL:"
          echo "${{ steps.run-server.outputs.ngrok_url }}"

      - name: Keep the job alive (Long running step)
        run: sleep 360m
