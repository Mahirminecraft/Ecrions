name: Minecraft Paper Server Rolling with Ngrok

on:
  workflow_dispatch:

jobs:
  minecraft:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # max 6 hours

    steps:
    # 1️⃣ Checkout repo
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        persist-credentials: false  # use GH_PAT for pushes

    # 2️⃣ Setup Java 21
    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: temurin
        java-version: '21'

    # 3️⃣ Download PaperMC if missing
    - name: Download Paper 1.21.8 build #58
      run: |
        if [ ! -f paper-1.21.8-58.jar ]; then
          curl -L -o paper-1.21.8-58.jar https://api.papermc.io/v2/projects/paper/versions/1.21.8/builds/58/downloads/paper-1.21.8-58.jar
        fi

    # 4️⃣ Accept EULA
    - name: Accept EULA
      run: echo "eula=true" > eula.txt

    # 5️⃣ Download Ngrok if missing
    - name: Download Ngrok
      run: |
        if [ ! -f ngrok ]; then
          echo "Downloading Ngrok..."
          curl -sLo ngrok.zip https://bin.equinox.io/c/4VmDzA7iaHb/ngrok-stable-linux-amd64.zip
          unzip ngrok.zip
          chmod +x ngrok
        fi

    # 6️⃣ Start Minecraft server with Ngrok tunnel
    - name: Run Minecraft Server with Ngrok
      run: |
        # Start server in background
        java -Xms2G -Xmx6G -jar paper-1.21.8-58.jar nogui &
        SERVER_PID=$!

        # Start Ngrok tunnel for Minecraft port
        ./ngrok tcp 25565 --log=stdout > ngrok.log &
        NGROK_PID=$!

        echo "Waiting for Ngrok to initialize..."
        sleep 10

        # Get public Ngrok TCP URL
        NGROK_URL=$(curl --silent http://127.0.0.1:4040/api/tunnels | jq -r '.tunnels[0].public_url')
        echo "Ngrok public IP/Port: $NGROK_URL"

        # Update website index.html in repo
        echo "<html><body><h1>Minecraft Server IP</h1><p>$NGROK_URL</p></body></html>" > index.html
        git config --global user.name "Ngrok IP Bot"
        git config --global user.email "ngrok@github.com"
        git add index.html
        git commit -m "Update server IP: $NGROK_URL" || echo "No changes"
        git push https://$GH_PAT@github.com/Mahirminecraft/Ecrions.git HEAD:main || echo "Push failed"

        # 5h0m → Run server for 5 hours, then stop
        sleep 18000

        echo "Stopping server and Ngrok..."
        kill -SIGINT $SERVER_PID || true
        kill -SIGINT $NGROK_PID || true
        wait $SERVER_PID 2>/dev/null || true
        wait $NGROK_PID 2>/dev/null || true

        # 5h1m → Backup
        TIMESTAMP=$(date +"%Y-%m-%d_%H-%M-%S")
        mkdir -p Backup
        ZIPFILE="Backup/mc-backup-$TIMESTAMP.zip"
        zip -r "$ZIPFILE" world world_nether world_the_end plugins config -x ".git/*" "Backup/*"

        # Push backup
        git add Backup/*.zip
        git commit -m "Backup at $TIMESTAMP" || echo "No changes"
        git push https://$GH_PAT@github.com/Mahirminecraft/Ecrions.git HEAD:main || echo "Push failed"

        # 5h2m → Trigger new workflow
        curl -X POST \
          -H "Authorization: Bearer $GH_PAT" \
          -H "Accept: application/vnd.github+json" \
          https://api.github.com/repos/Mahirminecraft/Ecrions/actions/workflows/mc-server.yml/dispatches \
          -d '{"ref":"main"}'

        # 5h3m → Exit current workflow
        echo "Workflow completed."
        exit 0
      env:
        GH_PAT: ${{ secrets.GH_PAT }}
