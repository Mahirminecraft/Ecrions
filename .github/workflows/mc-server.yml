name: Minecraft Paper Server with ngrok TCP

on:
  workflow_dispatch:

jobs:
  minecraft:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # ~6 hours

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup Java 21
      uses: actions/setup-java@v3
      with:
        distribution: temurin
        java-version: '21'

    - name: Install tools
      run: |
        sudo apt-get update -y
        sudo apt-get install -y zip unzip curl jq

    - name: Download Paper 1.21.8 build #58
      run: |
        while [ ! -f paper-1.21.8-58.jar ]; do
          curl -fL -o paper-1.21.8-58.jar \
            https://api.papermc.io/v2/projects/paper/versions/1.21.8/builds/58/downloads/paper-1.21.8-58.jar \
            && break
          echo "Download failed, retrying in 15s..."
          sleep 15
        done

    - name: Accept EULA
      run: echo "eula=true" > eula.txt

    - name: Restore files from repo
      run: |
        git fetch origin main --depth=1 || true
        git reset --hard origin/main || true

    - name: Install ngrok
      run: |
        curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc > /dev/null
        echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
        sudo apt-get update && sudo apt-get install -y ngrok

    - name: Start ngrok TCP tunnel
      env:
        NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
      run: |
        ngrok authtoken "$NGROK_AUTHTOKEN"
        nohup ngrok tcp 25565 > ngrok.log 2>&1 &
        sleep 15
        NGROK_URL=$(grep -o 'tcp://[0-9a-z\.]*:[0-9]*' ngrok.log | head -n 1)
        echo "Minecraft Public TCP Address: $NGROK_URL"
        echo "NGROK_URL=$NGROK_URL" >> $GITHUB_ENV

    - name: Run Minecraft Server with Backup
      env:
        GH_PAT: ${{ secrets.GH_PAT }}
      run: |
        set -euo pipefail
        REPO="https://$GH_PAT@github.com/${{ github.repository }}.git"

        git config --global user.name "Auto Save Bot"
        git config --global user.email "autosave@github.com"
        git remote set-url origin "$REPO"

        mkdir -p Backup

        # Start Minecraft in background
        java -Xms2G -Xmx2G -jar paper-1.21.8-58.jar nogui &

        # Keep workflow alive
        tail -f /dev/null
