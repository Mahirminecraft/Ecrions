name: Minecraft Paper Server with Backup & Auto-Restart

on:
  workflow_dispatch:

jobs:
  minecraft:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hours runtime

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        persist-credentials: false
        lfs: false

    - name: Setup environment
      run: |
        sudo apt-get update
        sudo apt-get install -y zip unzip curl jq
        git config --global user.name "Backup Bot"
        git config --global user.email "backup@github.com"

    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: temurin
        java-version: '21'

    - name: Download Paper
      run: |
        if [ ! -f paper-1.21.8-58.jar ]; then
          curl -L -o paper-1.21.8-58.jar \
            https://api.papermc.io/v2/projects/paper/versions/1.21.8/builds/58/downloads/paper-1.21.8-58.jar
        fi

    - name: Accept EULA
      run: echo "eula=true" > eula.txt

    - name: Restore latest backup
      run: |
        mkdir -p Backup
        LATEST_PREFIX=$(ls Backup 2>/dev/null | grep "mc-backup-" | sed 's/\.zip.*//' | sort -r | head -n1 || true)
        if [ -n "$LATEST_PREFIX" ]; then
          echo "Restoring latest backup: $LATEST_PREFIX"
          cat Backup/${LATEST_PREFIX}.zip* > Backup/${LATEST_PREFIX}-full.zip
          unzip -o Backup/${LATEST_PREFIX}-full.zip -d .
        else
          echo "No backup found, starting fresh server"
        fi

    - name: Run Minecraft Server with Periodic Backups
      run: |
        java -Xms14G -Xmx14G -jar paper-1.21.8-58.jar nogui &
        SERVER_PID=$!

        for i in $(seq 1 1); do  # ~5h
          sleep 60
          if (( $i % 30 == 0 )); then
            TIMESTAMP=$(date +"%Y-%m-%d_%H-%M-%S")
            echo "⏳ Backup at $TIMESTAMP"

            mkdir -p Backup
            zip -r "mc-backup-${TIMESTAMP}.zip" world world_nether world_the_end \
              -x "*/logs/*" "*/cache/*"
            split -b 500M "mc-backup-${TIMESTAMP}.zip" "Backup/mc-backup-${TIMESTAMP}.zip.part-"

            gh release create "backup-${TIMESTAMP}" "mc-backup-${TIMESTAMP}.zip" \
              --title "Backup $TIMESTAMP" --notes "Auto backup"

            BACKUPS=$(ls Backup | grep "mc-backup-" | sed 's/\.zip.*//' | sort -r | uniq)
            COUNT=$(echo "$BACKUPS" | wc -l)
            if [ "$COUNT" -gt 5 ]; then
              REMOVE=$(echo "$BACKUPS" | tail -n +6)
              for prefix in $REMOVE; do
                rm -f Backup/${prefix}.zip*
              done
            fi

            git add Backup || true
            git commit -m "Backup $TIMESTAMP" || echo "No changes"
            git push https://$GH_PAT@github.com/Mahirminecraft/Ecrions.git HEAD:main || true
          fi
        done

        echo "🛑 Stopping server after 5h..."
        kill $SERVER_PID
        wait $SERVER_PID || true

    - name: Final Backup & Trigger Restart Workflow
      run: |
        TIMESTAMP=$(date +"%Y-%m-%d_%H-%M-%S")
        zip -r "mc-backup-${TIMESTAMP}.zip" world world_nether world_the_end \
          -x "*/logs/*" "*/cache/*"
        split -b 500M "mc-backup-${TIMESTAMP}.zip" "Backup/mc-backup-${TIMESTAMP}.zip.part-"

        gh release create "backup-${TIMESTAMP}" "mc-backup-${TIMESTAMP}.zip" \
          --title "Final Backup $TIMESTAMP" --notes "Server shutdown backup"

        git add Backup || true
        git commit -m "Final backup $TIMESTAMP" || echo "No changes"
        git push https://$GH_PAT@github.com/Mahirminecraft/Ecrions.git HEAD:main || true

        echo "🚀 Triggering restart workflow in 1 min..."
        sleep 60
        gh workflow run restart.yml
