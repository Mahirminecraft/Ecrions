name: Minecraft Paper Server with Safe Backup & Auto Restart

on:
  workflow_dispatch:

jobs:
  minecraft:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hours

    steps:
    # 1️⃣ Checkout repo
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        persist-credentials: false

    # 2️⃣ Setup environment
    - name: Setup environment
      run: |
        sudo apt-get update
        sudo apt-get install -y zip unzip curl
        mkdir -p Backup

    # 3️⃣ Setup Java
    - name: Setup Java 21
      uses: actions/setup-java@v3
      with:
        distribution: temurin
        java-version: '21'

    # 4️⃣ Download Paper
    - name: Download Paper 1.21.8 build #58
      run: |
        if [ ! -f paper-1.21.8-58.jar ]; then
          curl -L -o paper-1.21.8-58.jar \
            https://api.papermc.io/v2/projects/paper/versions/1.21.8/builds/58/downloads/paper-1.21.8-58.jar
        fi

    # 5️⃣ Accept EULA
    - name: Accept EULA
      run: echo "eula=true" > eula.txt

    # 6️⃣ Restore latest backup
    - name: Restore latest backup
      run: |
        LATEST_PREFIX=$(ls Backup 2>/dev/null | grep "mc-backup-" | sed 's/\.zip.*//' | sort -r | head -n1)
        if [ -n "$LATEST_PREFIX" ]; then
          echo "Restoring latest backup: $LATEST_PREFIX"
          cat Backup/${LATEST_PREFIX}.zip* > Backup/${LATEST_PREFIX}-full.zip
          unzip -o Backup/${LATEST_PREFIX}-full.zip -d .
        else
          echo "No backup found, starting fresh server"
        fi

    # 7️⃣ Run server with backup + restart system
    - name: Run Minecraft Server with Backup & Restart
      run: |
        java -Xms16G -Xmx16G -jar paper-1.21.8-58.jar nogui &
        SERVER_PID=$!

        git config --global user.name "Auto Backup Bot"
        git config --global user.email "backup@github.com"
        git remote remove origin || true
        git remote add origin https://$GH_PAT@github.com/Mahirminecraft/Ecrions.git

        for i in $(seq 1 360); do
          sleep 60
          TIMESTAMP=$(date +"%Y-%m-%d_%H-%M-%S")

          # Every 30 mins → backup
          if [ $((i % 30)) -eq 0 ] && [ "$i" -lt 300 ]; then
            BACKUP_PREFIX="Backup/mc-backup-$TIMESTAMP"
            echo "Creating 30-min backup: $BACKUP_PREFIX"

            zip -r -s 500m "$BACKUP_PREFIX.zip" world world_nether world_the_end plugins config || true

            git add Backup/ || true
            if git commit -m "30-min Backup at $TIMESTAMP"; then
              git push origin HEAD:main --force || echo "Push failed"
            fi

            # keep only last 5 backups (20 files = 5x4 parts)
            ls -t Backup/mc-backup-*.zip* | tail -n +21 | xargs -r rm --
          fi

          # 5h → stop server + final backup
          if [ "$i" -eq 1 ]; then
            echo "Stopping Minecraft server at 5h..."
            kill $SERVER_PID
            wait $SERVER_PID || true

            BACKUP_PREFIX="Backup/mc-backup-$TIMESTAMP"
            echo "Creating FINAL backup: $BACKUP_PREFIX"

            zip -r -s 500m "$BACKUP_PREFIX.zip" world world_nether world_the_end plugins config || true

            # Push to repo
            git add Backup/ || true
            if git commit -m "Final Backup at $TIMESTAMP"; then
              git push origin HEAD:main --force || echo "Push failed"
            fi

            # Upload to Release
            gh release create "backup-$TIMESTAMP" Backup/mc-backup-$TIMESTAMP.zip* \
              --title "Backup $TIMESTAMP" --notes "Final 5h backup"

          fi

          # 5h1m → start new workflow
          if [ "$i" -eq 2 ]; then
            echo "Triggering new workflow..."
            curl -X POST \
              -H "Authorization: Bearer $GH_PAT" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/Mahirminecraft/Ecrions/actions/workflows/mc-server.yml/dispatches \
              -d '{"ref":"main"}'
          fi

          # 5h2m → exit current workflow
          if [ "$i" -eq 3 ]; then
            echo "Shutting down old workflow..."
            exit 0
          fi
        done
      env:
        GH_PAT: ${{ secrets.GH_PAT }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
