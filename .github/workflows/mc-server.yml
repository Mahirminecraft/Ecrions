name: Minecraft + ngrok raw logs

on:
  workflow_dispatch:

jobs:
  minecraft-ngrok:
    runs-on: ubuntu-latest

    steps:
    - name: Install tools
      run: |
        sudo apt-get update -y
        sudo apt-get install -y openjdk-21-jdk curl unzip

    - name: Download Paper Minecraft
      run: |
        curl -fL -o paper.jar https://api.papermc.io/v2/projects/paper/versions/1.21.8/builds/58/downloads/paper-1.21.8-58.jar
        echo "eula=true" > eula.txt

    - name: Download and install ngrok
      run: |
        curl -sL https://bin.equinox.io/c/4VmDzA7iaHb/ngrok-stable-linux-amd64.zip -o ngrok.zip
        unzip ngrok.zip
        chmod +x ngrok
        sudo mv ngrok /usr/local/bin/ngrok

    - name: Authenticate ngrok
      run: ngrok authtoken ${{ secrets.NGROK_AUTHTOKEN }}

    - name: Start Minecraft server and ngrok TCP tunnel
      run: |
        # Start Minecraft server in background
        java -Xms16G -Xmx16G -jar paper.jar nogui &

        # Start ngrok TCP in foreground (raw output)
        ngrok tcp 25565
