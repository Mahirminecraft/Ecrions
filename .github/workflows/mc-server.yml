name: Minecraft Server with ngrok

on:
  workflow_dispatch:

jobs:
  minecraft-ngrok:
    runs-on: ubuntu-latest

    steps:
    - name: Install Java & tools
      run: |
        sudo apt-get update -y
        sudo apt-get install -y openjdk-21-jdk curl unzip jq

    - name: Download and install ngrok
      run: |
        curl -sL https://bin.equinox.io/c/4VmDzA7iaHb/ngrok-stable-linux-amd64.zip -o ngrok.zip
        unzip ngrok.zip
        chmod +x ngrok
        sudo mv ngrok /usr/local/bin/ngrok
        ngrok version

    - name: Authenticate ngrok
      run: ngrok authtoken ${{ secrets.NGROK_AUTHTOKEN }}

    - name: Update ngrok agent to latest version
      run: |
        ngrok update
        ngrok version

    - name: Download Paper Minecraft
      run: |
        curl -fL -o paper.jar https://api.papermc.io/v2/projects/paper/versions/1.21.8/builds/58/downloads/paper-1.21.8-58.jar
        echo "eula=true" > eula.txt

    - name: Start Minecraft server
      run: |
        java -Xms1G -Xmx1G -jar paper.jar nogui &

    - name: Start ngrok TCP tunnel
      run: |
        ngrok tcp 25565 --log=stdout > ngrok.log 2>&1 &
        sleep 20
        cat ngrok.log
