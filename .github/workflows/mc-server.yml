name: Minecraft Paper Server Rolling Backup

on:
  workflow_dispatch:

jobs:
  minecraft:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hours

    steps:
    # 1️⃣ Checkout repo
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        persist-credentials: false

    # 2️⃣ Setup Java
    - name: Setup Java 21
      uses: actions/setup-java@v3
      with:
        distribution: temurin
        java-version: '21'

    # 3️⃣ Ensure Paper jar exists
    - name: Download Paper 1.21.8 build #58
      run: |
        if [ ! -f paper-1.21.8-58.jar ]; then
          curl -L -o paper-1.21.8-58.jar \
            https://api.papermc.io/v2/projects/paper/versions/1.21.8/builds/58/downloads/paper-1.21.8-58.jar
        fi

    # 4️⃣ Accept EULA
    - name: Accept EULA
      run: echo "eula=true" > eula.txt

    # 5️⃣ Restore latest backup
    - name: Restore latest backup
      run: |
        mkdir -p Backup
        LATEST=$(ls Backup | sort -r | head -n1)
        if [ -f "Backup/$LATEST" ]; then
          echo "Restoring latest backup: $LATEST"
          unzip -o "Backup/$LATEST" -d .
        fi

    # 6️⃣ Run server and rolling backup every 1 minute
    - name: Run Minecraft Server with Rolling Backup
      run: |
        # Start server in background
        java -Xms14G -Xmx14G -jar paper-1.21.8-58.jar nogui &
        SERVER_PID=$!

        # Git config
        git config --global user.name "Auto Backup Bot"
        git config --global user.email "backup@github.com"
        git remote remove origin || true
        git remote add origin https://$GH_PAT@github.com/Mahirminecraft/Ecrions.git

        # Loop every 1 minute (360 iterations = 6 hours)
        for i in $(seq 1 360); do
          sleep 60
          TIMESTAMP=$(date +"%Y-%m-%d_%H-%M-%S")
          BACKUP_FILE="Backup/mc-backup-$TIMESTAMP.zip"
          echo "Creating backup $BACKUP_FILE"

          zip -r "$BACKUP_FILE" ./*

          git add Backup/
          git commit -m "Backup at $TIMESTAMP" || echo "No changes"
          git push origin HEAD:main --force || echo "Push failed"

          # At 5h1m → trigger new workflow (iteration 301)
          if [ "$i" -eq 301 ]; then
            echo "Triggering new workflow..."
            curl -X POST \
              -H "Authorization: Bearer $GH_PAT" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/Mahirminecraft/Ecrions/actions/workflows/mc-server.yml/dispatches \
              -d '{"ref":"main"}'
          fi

          # At 5h2m → backup + stop server (iteration 302)
          if [ "$i" -eq 302 ]; then
            echo "Final backup before stopping server..."
            FINAL_BACKUP="Backup/mc-backup-final-$TIMESTAMP.zip"
            zip -r "$FINAL_BACKUP" ./*

            git add Backup/
            git commit -m "Final backup at $TIMESTAMP" || echo "No changes"
            git push origin HEAD:main --force || echo "Push failed"

            echo "Stopping server..."
            kill $SERVER_PID
            exit 0
          fi
        done
      env:
        GH_PAT: ${{ secrets.GH_PAT }}
