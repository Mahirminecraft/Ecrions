name: Minecraft + ngrok + No-IP SRV (Automatic)

on:
  workflow_dispatch:

jobs:
  minecraft-ngrok:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Install Java & ngrok
      run: |
        sudo apt-get update -y
        sudo apt-get install -y openjdk-21-jdk curl unzip zip jq
        curl -s https://bin.equinox.io/c/4VmDzA7iaHb/ngrok-stable-linux-amd64.zip -o ngrok.zip
        unzip ngrok.zip
        chmod +x ngrok
        sudo mv ngrok /usr/local/bin/ngrok

    - name: Download Paper Minecraft
      run: |
        curl -fL -o paper.jar https://api.papermc.io/v2/projects/paper/versions/1.21.8/builds/58/downloads/paper-1.21.8-58.jar
        echo "eula=true" > eula.txt

    - name: Start Minecraft server
      run: |
        java -Xms2G -Xmx2G -jar paper.jar nogui &
        sleep 5

    - name: Start ngrok TCP tunnel and update No-IP SRV
      env:
        NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        NOIP_USERNAME: ${{ secrets.NOIP_USERNAME }}
        NOIP_PASSWORD: ${{ secrets.NOIP_PASSWORD }}
      run: |
        # Authenticate ngrok
        ngrok authtoken $NGROK_AUTHTOKEN

        # Start ngrok TCP tunnel in background and save logs
        ngrok tcp 25565 --region us --log=stdout > ngrok.log &
        sleep 15

        # Get public ngrok host and port automatically
        NGROK_PUBLIC=$(grep -oP "tcp://\K[^ ]+" ngrok.log | head -n1)
        if [ -z "$NGROK_PUBLIC" ]; then
          echo "Error: ngrok public address not found"
          exit 1
        fi

        NGROK_HOST=$(echo $NGROK_PUBLIC | cut -d':' -f1)
        NGROK_PORT=$(echo $NGROK_PUBLIC | cut -d':' -f2)

        echo "ngrok public: $NGROK_HOST:$NGROK_PORT"

        # Update No-IP A record dynamically
        curl -s "http://${NOIP_USERNAME}:${NOIP_PASSWORD}@dynupdate.no-ip.com/nic/update?hostname=ecrion.ddns.net&myip=$NGROK_HOST" \
             -o noip_update.log
        cat noip_update.log

        # Update No-IP SRV record automatically using their API (via JSON)
        # SRV: _minecraft._tcp.ecrion.ddns.net -> NGROK_HOST:NGROK_PORT
        # No-IP's SRV API supports JSON, using curl here
        curl -s -X POST "https://dynupdate.no-ip.com/nic/update" \
          -u "${NOIP_USERNAME}:${NOIP_PASSWORD}" \
          -d "hostname=ecrion.ddns.net" \
          -d "service=_minecraft._tcp" \
          -d "port=${NGROK_PORT}" \
          -d "target=${NGROK_HOST}" \
          -o noip_srv.log
        cat noip_srv.log

        echo "Minecraft clients can now connect to ecrion.ddns.net (port handled by SRV)"

    - name: Keep Minecraft server alive
      run: sleep 3600
