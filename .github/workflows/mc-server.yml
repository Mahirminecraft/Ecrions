name: Minecraft Paper Server Rolling Test Mode

on:
  workflow_dispatch:

jobs:
  minecraft:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # Enough for testing loop

    steps:
    # 1️⃣ Checkout repo
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        persist-credentials: false

    # 2️⃣ Setup Java 21
    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: temurin
        java-version: '21'

    # 3️⃣ Ensure Paper jar exists
    - name: Download Paper 1.21.8 build #58
      run: |
        if [ ! -f paper-1.21.8-58.jar ]; then
          curl -L -o paper-1.21.8-58.jar https://api.papermc.io/v2/projects/paper/versions/1.21.8/builds/58/downloads/paper-1.21.8-58.jar
        fi

    # 4️⃣ Accept EULA
    - name: Accept EULA
      run: echo "eula=true" > eula.txt

    # 5️⃣ Wait before starting server
    - name: Wait before starting server
      run: sleep 5

    # 6️⃣ Run Minecraft Server with Test Backups and Controller Logic
    - name: Run Minecraft Server with Test Backups
      env:
        GH_PAT: ${{ secrets.GH_PAT }}
      run: |
        mkdir -p Backup

        # Git config
        git config --global user.name "Auto Save Bot"
        git config --global user.email "autosave@github.com"
        git remote set-url origin https://$GH_PAT@github.com/Mahirminecraft/Ecrions.git

        # Start Minecraft server in background
        java -Xms1G -Xmx1G -jar paper-1.21.8-58.jar nogui &

        # Backup loop: every 1 minute for 3 cycles
        for i in {1..3}; do
          sleep 60  # 1 minute

          # Create backup
          ZIP_NAME="Backup/test-backup-$(date +'%Y-%m-%d_%H-%M-%S').zip"
          zip -r $ZIP_NAME world/ plugins/ config/

          # Keep only latest 2 backups
          BACKUPS=$(ls -1tr Backup | grep 'test-backup' | sort)
          COUNT=$(echo "$BACKUPS" | wc -l)
          if [ $COUNT -gt 2 ]; then
            TO_DELETE=$(echo "$BACKUPS" | head -n $(($COUNT - 2)))
            echo "Deleting old backup files:"
            echo "$TO_DELETE"
            echo "$TO_DELETE" | xargs -I {} rm -f Backup/{}
          fi

          # Commit and push backup
          git add Backup/
          git commit -m "Test backup at $(date +"%Y-%m-%d %H:%M:%S")" || echo "No changes"
          git push origin HEAD:main --force || echo "Push failed"

          # Optional: trigger workflow again (for testing auto-relaunch)
          echo "Triggering workflow again..."
          curl -X POST \
            -H "Authorization: Bearer $GH_PAT" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Mahirminecraft/Ecrions/actions/workflows/mc-server.yml/dispatches \
            -d '{"ref":"main"}'
        done

        # Stop server after test
        echo "Test complete, stopping server..."
        pkill -f "paper-1.21.8-58.jar"

        echo "Test workflow finished."
