name: Minecraft Paper Server with Safe Backup, Auto Shutdown & Ngrok

on:
  workflow_dispatch:

jobs:
  minecraft:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hours

    steps:
    # 1️⃣ Checkout repo
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        persist-credentials: false
        lfs: true

    # 2️⃣ Setup environment
    - name: Setup environment
      run: |
        sudo apt-get update
        sudo apt-get install -y git-lfs zip unzip curl jq
        git lfs install
        git lfs track "Backup/*.zip*"
        git add .gitattributes || true
        git commit -m "Track split backup zips" || echo "Already committed"

    # 3️⃣ Setup Java 21
    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: temurin
        java-version: '21'

    # 4️⃣ Download Paper jar if missing
    - name: Download Paper 1.21.8 build #58
      run: |
        if [ ! -f paper-1.21.8-58.jar ]; then
          curl -L -o paper-1.21.8-58.jar \
            https://api.papermc.io/v2/projects/paper/versions/1.21.8/builds/58/downloads/paper-1.21.8-58.jar
        fi

    # 5️⃣ Accept EULA
    - name: Accept EULA
      run: echo "eula=true" > eula.txt

    # 6️⃣ Download Ngrok if missing
    - name: Download Ngrok
      run: |
        if [ ! -f ngrok ]; then
          echo "Downloading Ngrok..."
          curl -sLo ngrok.zip https://bin.equinox.io/c/4VmDzA7iaHb/ngrok-stable-linux-amd64.zip
          unzip ngrok.zip
          chmod +x ngrok
        fi

    # 7️⃣ Restore latest backup
    - name: Restore latest backup
      run: |
        mkdir -p Backup
        LATEST_PREFIX=$(ls Backup | grep "mc-backup-" | sed 's/\.zip.*//' | sort -r | head -n1)
        if [ -n "$LATEST_PREFIX" ]; then
          echo "Restoring latest backup: $LATEST_PREFIX"
          cat Backup/${LATEST_PREFIX}.zip* > Backup/${LATEST_PREFIX}-full.zip
          unzip -o Backup/${LATEST_PREFIX}-full.zip -d .
        else
          echo "No backup found, starting fresh server"
        fi

    # 8️⃣ Run server with Ngrok, backup, and workflow automation
    - name: Run Minecraft Server with Ngrok & Scheduled Backup
      run: |
        # Start Minecraft server in background
        java -Xms14G -Xmx14G -jar paper-1.21.8-58.jar nogui &
        SERVER_PID=$!

        # Start Ngrok tunnel
        ./ngrok tcp 25565 --log=stdout > ngrok.log &
        NGROK_PID=$!
        sleep 10  # wait for ngrok to start

        # Get Ngrok public TCP URL
        NGROK_URL=$(curl -s http://127.0.0.1:4040/api/tunnels | jq -r '.tunnels[0].public_url')
        echo "Ngrok public IP/Port: $NGROK_URL"

        # Update website file in repo
        echo "<html><body><h1>Minecraft Server IP</h1><p>$NGROK_URL</p></body></html>" > index.html
        git config --global user.name "Ngrok IP Bot"
        git config --global user.email "ngrok@github.com"
        git add index.html
        git commit -m "Update server IP: $NGROK_URL" || echo "No changes"
        git push https://$GH_PAT@github.com/Mahirminecraft/Ecrions.git HEAD:main || echo "Push failed"

        git config --global user.name "Auto Backup Bot"
        git config --global user.email "backup@github.com"
        git remote remove origin || true
        git remote add origin https://$GH_PAT@github.com/Mahirminecraft/Ecrions.git

        for i in $(seq 1 360); do
          sleep 60
          TIMESTAMP=$(date +"%Y-%m-%d_%H-%M-%S")

          # 5h → stop server
          if [ "$i" -eq 300 ]; then
            echo "Stopping Minecraft server at 5h..."
            kill $SERVER_PID
            kill $NGROK_PID
          fi

          # 5h1m → create backup
          if [ "$i" -eq 301 ]; then
            BACKUP_PREFIX="Backup/mc-backup-$TIMESTAMP"
            echo "Creating split backup $BACKUP_PREFIX after server stopped"
            zip -r -s 500m "$BACKUP_PREFIX.zip" world world_nether world_the_end plugins config || echo "Some files skipped"
            git add Backup/
            git commit -m "Backup at $TIMESTAMP" || echo "No changes"
            git push origin HEAD:main --force || echo "Push failed"
            rm -f Backup/mc-backup-$TIMESTAMP.zip*
          fi

          # 5h2m → trigger new workflow
          if [ "$i" -eq 302 ]; then
            echo "Triggering new workflow at 5h2m..."
            curl -X POST \
              -H "Authorization: Bearer $GH_PAT" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/Mahirminecraft/Ecrions/actions/workflows/mc-server.yml/dispatches \
              -d '{"ref":"main"}'
          fi

          # 5h3m → exit previous workflow safely
          if [ "$i" -eq 303 ]; then
            echo "Previous workflow going offline at 5h3m..."
            exit 0
          fi
        done
      env:
        GH_PAT: ${{ secrets.GH_PAT }}
