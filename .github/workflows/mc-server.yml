name: Minecraft Server with ngrok

on:
  workflow_dispatch:

jobs:
  minecraft:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # Adjust as needed

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: temurin
        java-version: '17'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y curl unzip jq

    - name: Download Minecraft Server
      run: |
        curl -o minecraft_server.jar https://launcher.mojang.com/v1/objects/your_server_version/server.jar

    - name: Accept EULA
      run: echo "eula=true" > eula.txt

    - name: Start Minecraft Server
      run: |
        java -Xmx2G -Xms2G -jar minecraft_server.jar nogui &
        MCS_PID=$!

    - name: Download and Install ngrok
      run: |
        curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc > /dev/null
        echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
        sudo apt-get update && sudo apt-get install -y ngrok

    - name: Run ngrok to expose port 25565
      run: |
        ngrok authtoken ${{ secrets.NGROK_AUTH_TOKEN }}
        nohup ngrok tcp 25565 > ngrok.log &
        sleep 10  # Wait for ngrok to initialize

    - name: Extract ngrok TCP URL
      run: |
        NGROK_URL=$(grep -o 'tcp://[a-z0-9]*\.ngrok\.io:[0-9]*' ngrok.log | head -n 1)
        echo "Minecraft Public TCP Address: $NGROK_URL"
        echo "NGROK_URL=$NGROK_URL" >> $GITHUB_ENV

    - name: Display ngrok TCP URL
      run: echo "Players can connect using: ${{ env.NGROK_URL }}"

    - name: Keep server running
      run: |
        wait $MCS_PID
