name: Minecraft Server

on:
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --ssh --hostname=gh-mcserver

      - name: Enable Funnel for Minecraft
        run: |
          sudo tailscale serve --bg --tcp=8443 tcp://localhost:8443
          sudo tailscale funnel 8443 --bg

      - name: Download Minecraft server jar
        run: |
          curl -o server.jar https://piston-data.mojang.com/v1/objects/fe123456.../server.jar
          echo "eula=true" > eula.txt

      - name: Start Minecraft server
        run: |
          java -Xmx2G -Xms2G -jar server.jar nogui
