name: Minecraft Paper Server Rolling with Controller + Tailscale Funnel + No-IP

on:
  workflow_dispatch:

jobs:
  minecraft:
    runs-on: ubuntu-latest
    timeout-minutes: 370  # a bit more than 6h for 5h2m logic

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        persist-credentials: false

    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: temurin
        java-version: '21'

    - name: Install tools
      run: |
        sudo apt-get update -y
        sudo apt-get install -y zip unzip jq curl

    - name: Download Paper 1.21.8 build #58
      run: |
        while [ ! -f paper-1.21.8-58.jar ]; do
          curl -fL -o paper-1.21.8-58.jar \
            https://api.papermc.io/v2/projects/paper/versions/1.21.8/builds/58/downloads/paper-1.21.8-58.jar \
            && break
          echo "Download failed, retrying in 15s..."
          sleep 15
        done

    - name: Accept EULA
      run: echo "eula=true" > eula.txt

    - name: Restore files from repo
      run: |
        git fetch origin main --depth=1 || true
        git reset --hard origin/main || true

    - name: Wait before starting server
      run: sleep 5

    - name: Setup Tailscale + Funnel + No-IP
      env:
        TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        NOIP_USERNAME: ${{ secrets.NOIP_USERNAME }}
        NOIP_PASSWORD: ${{ secrets.NOIP_PASSWORD }}
        NOIP_HOSTNAME: ecrion.qzz.io
      run: |
        set -euo pipefail

        echo "Installing Tailscale..."
        curl -fsSL https://tailscale.com/install.sh | sh

        echo "Starting tailscaled..."
        sudo tailscaled --state=mem:&
        sleep 3

        echo "Connecting Tailscale..."
        sudo tailscale up --authkey=$TAILSCALE_AUTH_KEY --hostname=mc-server

        echo "Enabling Funnel on port 25565..."
        sudo tailscale funnel 25565 &

        # Wait a few seconds for Funnel IP to be assigned
        sleep 10

        # Get public Funnel IP
        FUNNEL_IP=$(tailscale status --json | jq -r '.Self.FunnelIPv4 // empty')
        if [ -z "$FUNNEL_IP" ]; then
          echo "Funnel IP not found!"
          exit 1
        fi
        echo "Current Funnel IP: $FUNNEL_IP"

        # Update No-IP
        echo "Updating No-IP to point to Funnel IP..."
        curl -s "http://$NOIP_USERNAME:$NOIP_PASSWORD@dynupdate.no-ip.com/nic/update?hostname=$NOIP_HOSTNAME&myip=$FUNNEL_IP" \
             -o noip_update.log
        cat noip_update.log

        echo "Your Minecraft server should now be reachable at $NOIP_HOSTNAME:25565"

    - name: Run Minecraft Server with Backup & Controller
      env:
        GH_PAT: ${{ secrets.GH_PAT }}
      run: |
        set -euo pipefail
        REPO="https://$GH_PAT@github.com/${{ github.repository }}.git"

        git config --global user.name "Auto Save Bot"
        git config --global user.email "autosave@github.com"
        git remote set-url origin "$REPO"

        mkdir -p Backup

        java -Xms16G -Xmx16G -jar paper-1.21.8-58.jar nogui &
        MCS_PID=$!

        for i in {1..10}; do
          sleep 1800

          echo "=== Backup cycle $i ==="

          # Rotate backups
          for PART in {1..4}; do
            [ -f "Backup/${PART}.Backup-previous.zip" ] && rm -f "Backup/${PART}.Backup-previous.zip"
            [ -f "Backup/${PART}.Backup-latest.zip" ] && mv "Backup/${PART}.Backup-latest.zip" "Backup/${PART}.Backup-previous.zip"
            zip -r "Backup/${PART}.Backup-latest.zip" world/ plugins/ config/ || true
          done

          # Sync repo with all files (overwrite/add, no deletes)
          git add -A
          git commit -m "Backup cycle $i" || true
          until git push origin HEAD:main --force; do
            echo "Push failed, retrying in 10s..."
            sleep 10
          done
        done

        echo "=== Final backup at 5h ==="
        FINAL_ZIP="Backup/minecraft-backup-final.zip"
        zip -r "$FINAL_ZIP" world/ plugins/ config/ || true

        git add -A
        git commit -m "Final backup" || true
        until git push origin HEAD:main --force; do
          echo "Final push failed, retrying..."
          sleep 10
        done

        # Create release
        TAG="backup-$(date -u +%Y%m%dT%H%M%SZ)"
        curl -s -X POST \
          -H "Authorization: token $GH_PAT" \
          -H "Content-Type: application/json" \
          -d "{\"tag_name\":\"$TAG\",\"name\":\"Final backup $TAG\",\"body\":\"Auto backup\"}" \
          https://api.github.com/repos/${{ github.repository }}/releases

        # Trigger new workflow (5h1m)
        sleep 60
        until curl -s -X POST \
          -H "Authorization: token $GH_PAT" \
          -H "Accept: application/vnd.github+json" \
          https://api.github.com/repos/${{ github.repository }}/actions/workflows/mc-server.yml/dispatches \
          -d '{"ref":"main"}'; do
          echo "Dispatch failed, retrying..."
          sleep 10
        done

        # Stop current workflow at 5h2m
        sleep 60
        kill -9 $MCS_PID || true
        echo "Workflow stopped."
