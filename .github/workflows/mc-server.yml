name: Minecraft Paper Server Rolling with Controller + ngrok/No-IP

on:
  workflow_dispatch:

jobs:
  minecraft:
    runs-on: ubuntu-latest
    timeout-minutes: 370  # a bit more than 6h for 5h2m logic

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        persist-credentials: false

    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: temurin
        java-version: '21'

    - name: Install tools
      run: |
        sudo apt-get update -y
        sudo apt-get install -y zip unzip jq curl dnsutils

    - name: Download Paper 1.21.8 build #58
      run: |
        while [ ! -f paper-1.21.8-58.jar ]; do
          curl -fL -o paper-1.21.8-58.jar \
            https://api.papermc.io/v2/projects/paper/versions/1.21.8/builds/58/downloads/paper-1.21.8-58.jar \
            && break
          echo "Download failed, retrying in 15s..."
          sleep 15
        done

    - name: Accept EULA
      run: echo "eula=true" > eula.txt

    - name: Restore files from repo
      run: |
        git fetch origin main --depth=1 || true
        git reset --hard origin/main || true

    - name: Install ngrok
      run: |
        curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc > /dev/null
        echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
        sudo apt-get update && sudo apt-get install -y ngrok

    - name: Start ngrok TCP tunnel
      env:
        NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
      run: |
        ngrok authtoken "$NGROK_AUTHTOKEN"
        nohup ngrok tcp 25565 > ngrok.log 2>&1 &
        sleep 10

    - name: Fetch ngrok TCP endpoint and numeric IP
      env:
        NGROK_API_KEY: ${{ secrets.NGROK_API_KEY }}
      run: |
        RESPONSE=$(curl -s -H "Authorization: Bearer $NGROK_API_KEY" \
          -H "Ngrok-Version: 2" \
          https://api.ngrok.com/tunnels)

        NGROK_URL=$(echo "$RESPONSE" | jq -r '.tunnels[] | select(.public_url | startswith("tcp://")) | .public_url' | head -n 1)

        if [ -z "$NGROK_URL" ]; then
          echo "❌ No TCP tunnel found"
          exit 1
        fi

        HOST=$(echo "$NGROK_URL" | cut -d'/' -f3 | cut -d':' -f1)
        PORT=$(echo "$NGROK_URL" | cut -d':' -f3)
        IP=$(dig +short $HOST | head -n 1)

        echo "✅ Ngrok TCP Endpoint: $HOST:$PORT"
        echo "✅ Numeric IP: $IP:$PORT"

        echo "NGROK_URL=$NGROK_URL" >> $GITHUB_ENV
        echo "HOST=$HOST" >> $GITHUB_ENV
        echo "PORT=$PORT" >> $GITHUB_ENV
        echo "IP=$IP" >> $GITHUB_ENV

        echo "### Minecraft Address" >> $GITHUB_STEP_SUMMARY
        echo "- Hostname: \`$HOST:$PORT\`" >> $GITHUB_STEP_SUMMARY
        echo "- Numeric IP: \`$IP:$PORT\`" >> $GITHUB_STEP_SUMMARY

    - name: Setup No-IP Dynamic DNS
      env:
        NOIP_USER: ${{ secrets.NOIP_USERNAME }}
        NOIP_PASS: ${{ secrets.NOIP_PASSWORD }}
        NOIP_HOST: ${{ secrets.NOIP_HOSTNAME }}
      run: |
        echo "Updating No-IP domain $NOIP_HOST → $IP"
        curl -s -u "$NOIP_USER:$NOIP_PASS" "http://dynupdate.no-ip.com/nic/update?hostname=$NOIP_HOST&myip=$IP" || true
        
    - name: Notify Telegram bot
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        NOIP_HOST: ${{ secrets.NOIP_HOSTNAME }}
        PORT: ${{ env.PORT }}
      run: |
        # Send startup message
        MESSAGE="🎮 Minecraft server is LIVE!\n\nConnect at:\n🌐 $NOIP_HOST:$PORT"
        curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
          -d chat_id="$TELEGRAM_CHAT_ID" \
          -d text="$MESSAGE"

        # Start listener for /ip or /port commands
        nohup bash -c '
        OFFSET=0
        while true; do
          UPDATES=$(curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/getUpdates?offset=$OFFSET&timeout=10")
          COUNT=$(echo "$UPDATES" | jq ".result | length")
          if [ "$COUNT" -gt 0 ]; then
            for row in $(echo "$UPDATES" | jq -c ".result[]"); do
              UPDATE_ID=$(echo "$row" | jq -r ".update_id")
              TEXT=$(echo "$row" | jq -r ".message.text // empty")
              OFFSET=$((UPDATE_ID+1))  # advance offset so same msg isn’t re-read
              if [[ "$TEXT" == "/ip" || "$TEXT" == "/port" ]]; then
                REPLY="🎮 Server address:\n🌐 '"$NOIP_HOST:$PORT"'"
                curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
                  -d chat_id="$TELEGRAM_CHAT_ID" \
                  -d text="$REPLY"
              fi
            done
          fi
          sleep 2
        done
        ' >/dev/null 2>&1 &

    - name: Start Minecraft Server
      run: |
        echo "Starting Minecraft server..."
        java -Xms16G -Xmx16G -jar paper-1.21.8-58.jar nogui &
        echo $! > mc.pid
    - name: Run Minecraft Server with Backup & Controller
      env:
        GH_PAT: ${{ secrets.GH_PAT }}
      run: |
        set -euo pipefail
        REPO="https://$GH_PAT@github.com/${{ github.repository }}.git"

        git config --global user.name "Auto Save Bot"
        git config --global user.email "autosave@github.com"
        git remote set-url origin "$REPO"

        mkdir -p Backup

        # Start backup cycles (every 30 min ×10 cycles)
        for i in {1..10}; do
          sleep 1800

          echo "=== Backup cycle $i ==="

          # Rotate backups
          for PART in {1..4}; do
            [ -f "Backup/${PART}.Backup-previous.zip" ] && rm -f "Backup/${PART}.Backup-previous.zip"
            [ -f "Backup/${PART}.Backup-latest.zip" ] && mv "Backup/${PART}.Backup-latest.zip" "Backup/${PART}.Backup-previous.zip"
            zip -r "Backup/${PART}.Backup-latest.zip" world/ plugins/ config/ || true
          done

          # Sync repo with all files
          git add -A
          git commit -m "Backup cycle $i" || true
          until git push origin HEAD:main --force; do
            echo "Push failed, retrying in 10s..."
            sleep 10
          done
        done

        echo "=== Final backup at 5h ==="
        FINAL_ZIP="Backup/minecraft-backup-final.zip"
        zip -r "$FINAL_ZIP" world/ plugins/ config/ || true

        git add -A
        git commit -m "Final backup" || true
        until git push origin HEAD:main --force; do
          echo "Final push failed, retrying..."
          sleep 10
        done

        # Create release
        TAG="backup-$(date -u +%Y%m%dT%H%M%SZ)"
        curl -s -X POST \
          -H "Authorization: token $GH_PAT" \
          -H "Content-Type: application/json" \
          -d "{\"tag_name\":\"$TAG\",\"name\":\"Final backup $TAG\",\"body\":\"Auto backup\"}" \
          https://api.github.com/repos/${{ github.repository }}/releases

        # Trigger new workflow (5h1m)
        sleep 60
        until curl -s -X POST \
          -H "Authorization: token $GH_PAT" \
          -H "Accept: application/vnd.github+json" \
          https://api.github.com/repos/${{ github.repository }}/actions/workflows/mc-server.yml/dispatches \
          -d '{"ref":"main"}'; do
          echo "Dispatch failed, retrying..."
          sleep 10
        done

        # Stop current workflow at 5h2m
        sleep 60
        kill -9 $(cat mc.pid) || true
        echo "Workflow stopped."

    - name: Keep workflow alive (fallback)
      run: sleep infinity
