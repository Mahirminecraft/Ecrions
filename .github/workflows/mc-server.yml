name: Minecraft Paper Server Rolling Split Backup

on:
  workflow_dispatch:

jobs:
  minecraft:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hours

    steps:
    # 1️⃣ Checkout repo with LFS
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        persist-credentials: false
        lfs: true

    # 2️⃣ Setup Git LFS
    - name: Install Git LFS
      run: |
        sudo apt-get update
        sudo apt-get install -y git-lfs zip unzip
        git lfs install
        git lfs track "Backup/*.zip*"  # include split parts
        git add .gitattributes || true
        git commit -m "Track split backup zips with LFS" || echo "Already committed"

    # 3️⃣ Setup Java
    - name: Setup Java 21
      uses: actions/setup-java@v3
      with:
        distribution: temurin
        java-version: '21'

    # 4️⃣ Ensure Paper jar exists
    - name: Download Paper 1.21.8 build #58
      run: |
        if [ ! -f paper-1.21.8-58.jar ]; then
          curl -L -o paper-1.21.8-58.jar \
            https://api.papermc.io/v2/projects/paper/versions/1.21.8/builds/58/downloads/paper-1.21.8-58.jar
        fi

    # 5️⃣ Accept EULA
    - name: Accept EULA
      run: echo "eula=true" > eula.txt

    # 6️⃣ Restore latest backup from repo Backup folder
    - name: Restore latest split backup
      run: |
        mkdir -p Backup
        # find latest backup prefix
        LATEST_PREFIX=$(ls Backup | grep "mc-backup-" | sed 's/\.zip.*//' | sort -r | head -n1)
        if [ -n "$LATEST_PREFIX" ]; then
          echo "Restoring latest backup: $LATEST_PREFIX"
          # join all parts
          cat Backup/${LATEST_PREFIX}.zip* > Backup/${LATEST_PREFIX}-full.zip
          unzip -o Backup/${LATEST_PREFIX}-full.zip -d .
        else
          echo "No backup found, starting fresh server"
        fi

    # 7️⃣ Run server and rolling split backup every 1 minute
    - name: Run Minecraft Server with Split Rolling Backup
      run: |
        java -Xms14G -Xmx14G -jar paper-1.21.8-58.jar nogui &
        SERVER_PID=$!

        git config --global user.name "Auto Backup Bot"
        git config --global user.email "backup@github.com"
        git remote remove origin || true
        git remote add origin https://$GH_PAT@github.com/Mahirminecraft/Ecrions.git

        for i in $(seq 1 360); do
          sleep 60
          TIMESTAMP=$(date +"%Y-%m-%d_%H-%M-%S")
          BACKUP_PREFIX="Backup/mc-backup-$TIMESTAMP"
          echo "Creating split backup $BACKUP_PREFIX"

          # zip only essential server folders, split into 500MB parts
          zip -r -s 500m "$BACKUP_PREFIX.zip" world world_nether world_the_end plugins config || echo "Some files skipped"

          # commit all parts
          git add Backup/
          git commit -m "Backup at $TIMESTAMP" || echo "No changes"
          git push origin HEAD:main --force || echo "Push failed"

          # delete local split parts to save space
          rm -f Backup/mc-backup-$TIMESTAMP.zip* 

          # trigger new workflow at 5h1m
          if [ "$i" -eq 301 ]; then
            curl -X POST \
              -H "Authorization: Bearer $GH_PAT" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/Mahirminecraft/Ecrions/actions/workflows/mc-server.yml/dispatches \
              -d '{"ref":"main"}'
          fi

          # final backup + stop at 5h2m
          if [ "$i" -eq 302 ]; then
            FINAL_PREFIX="Backup/mc-backup-final-$TIMESTAMP"
            zip -r -s 500m "$FINAL_PREFIX.zip" world world_nether world_the_end plugins config || echo "Some files skipped"
            git add Backup/
            git commit -m "Final backup at $TIMESTAMP" || echo "No changes"
            git push origin HEAD:main --force || echo "Push failed"
            rm -f Backup/mc-backup-final-$TIMESTAMP.zip*
            kill $SERVER_PID
            exit 0
          fi
        done
      env:
        GH_PAT: ${{ secrets.GH_PAT }}
