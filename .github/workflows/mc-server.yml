name: Minecraft Paper Server Rolling with Controller

on:
  workflow_dispatch:

jobs:
  minecraft:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # max 6 hours

    steps:
    # 1️⃣ Checkout repo
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        persist-credentials: false  # use GH_PAT for pushes

    # 2️⃣ Setup Java 21
    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: temurin
        java-version: '21'

    # 3️⃣ Ensure Paper jar exists
    - name: Download Paper 1.21.8 build #58
      run: |
        if [ ! -f paper-1.21.8-58.jar ]; then
          curl -L -o paper-1.21.8-58.jar https://api.papermc.io/v2/projects/paper/versions/1.21.8/builds/58/downloads/paper-1.21.8-58.jar
        fi

    # 4️⃣ Accept EULA
    - name: Accept EULA
      run: echo "eula=true" > eula.txt

    # 5️⃣ Restore latest backup before starting server
    - name: Restore latest backup
      run: |
        mkdir -p Backup
        LATEST_ZIP=$(ls -1tr Backup/*.zip 2>/dev/null | tail -n 1)
        if [ -n "$LATEST_ZIP" ]; then
          echo "Restoring latest backup: $LATEST_ZIP"
          unzip -o "$LATEST_ZIP" -d ./
        else
          echo "No backup found. Starting fresh."
        fi

    # 6️⃣ Wait a few seconds before starting server
    - name: Wait before starting server
      run: sleep 10

    # 7️⃣ Run Minecraft Server with Backups
    - name: Run Minecraft Server with Backups and Controller Logic
      env:
        GH_PAT: ${{ secrets.GH_PAT }}
      run: |
        mkdir -p Backup

        # Git config
        git config --global user.name "Auto Save Bot"
        git config --global user.email "autosave@github.com"
        git remote set-url origin https://$GH_PAT@github.com/Mahirminecraft/Ecrions.git

        # Start Minecraft server in background
        java -Xms16G -Xmx16G -jar paper-1.21.8-58.jar nogui &

        # Backup loop: every 30 minutes for 5 hours (10 cycles)
        for i in {1..10}; do
          sleep 1800  # 30 minutes

          # Create 4 incremental backups
          for PART in {1..4}; do
            ZIP_NAME="Backup/${PART}-backup-$(date +'%Y-%m-%d_%H-%M-%S').zip"
            zip -r $ZIP_NAME world/ plugins/ config/
          done

          # Keep only latest 8 incremental backups
          BACKUPS=$(ls -1tr Backup | grep 'backup' | sort)
          COUNT=$(echo "$BACKUPS" | wc -l)
          if [ $COUNT -gt 8 ]; then
            TO_DELETE=$(echo "$BACKUPS" | head -n $(($COUNT - 8)))
            echo "Deleting old backup files:"
            echo "$TO_DELETE"
            echo "$TO_DELETE" | xargs -I {} rm -f Backup/{}
          fi

          # Commit and push incremental backups
          git add Backup/
          git commit -m "Backup at $(date +"%Y-%m-%d %H:%M:%S")" || echo "No changes"
          git push origin HEAD:main --force || echo "Push failed"
        done

        # 5h: Stop server and create final backup
        echo "5 hours reached, stopping server..."
        FINAL_ZIP="minecraft-backup-final-$(date +'%Y-%m-%d_%H-%M-%S').zip"
        zip -r $FINAL_ZIP world/ plugins/ config/
        pkill -f "paper-1.21.8-58.jar"

        # Push final backup to repo
        git add $FINAL_ZIP
        git commit -m "Final backup at $(date +"%Y-%m-%d %H:%M:%S")" || echo "No changes"
        git push origin HEAD:main --force || echo "Push failed"

        # Trigger new workflow
        echo "Triggering new workflow..."
        curl -X POST \
          -H "Authorization: Bearer $GH_PAT" \
          -H "Accept: application/vnd.github+json" \
          https://api.github.com/repos/Mahirminecraft/Ecrions/actions/workflows/mc-server.yml/dispatches \
          -d '{"ref":"main"}'

        # Exit workflow after 2 minutes
        echo "Waiting 2 minutes before exiting workflow..."
        sleep 120
        echo "Exiting controller workflow."
