name: Minecraft Backup Controller with Tailscale + No-IP

on:
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 370  # ~6h

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        persist-credentials: false

    - name: Install tools
      run: |
        sudo apt-get update -y
        sudo apt-get install -y zip unzip jq curl rsync

    - name: Sync Minecraft files from persistent server
      env:
        SERVER_USER: ${{ secrets.SERVER_USER }}
        SERVER_IP: ${{ secrets.SERVER_IP }}
        SERVER_PATH: ${{ secrets.SERVER_PATH }}
      run: |
        # Sync world, plugins, config from persistent server
        rsync -avz --delete $SERVER_USER@$SERVER_IP:$SERVER_PATH/world/ ./world/
        rsync -avz --delete $SERVER_USER@$SERVER_IP:$SERVER_PATH/plugins/ ./plugins/
        rsync -avz --delete $SERVER_USER@$SERVER_IP:$SERVER_PATH/config/ ./config/

    - name: Rotate backups
      run: |
        mkdir -p Backup
        for PART in {1..4}; do
          [ -f "Backup/${PART}.Backup-previous.zip" ] && rm -f "Backup/${PART}.Backup-previous.zip"
          [ -f "Backup/${PART}.Backup-latest.zip" ] && mv "Backup/${PART}.Backup-latest.zip" "Backup/${PART}.Backup-previous.zip"
          zip -r "Backup/${PART}.Backup-latest.zip" world/ plugins/ config/ || true
        done

    - name: Commit and push backups
      env:
        GH_PAT: ${{ secrets.GH_PAT }}
      run: |
        git config --global user.name "Auto Save Bot"
        git config --global user.email "autosave@github.com"
        git add -A
        git commit -m "Automated backup $(date -u +%Y%m%dT%H%M%SZ)" || true
        until git push https://$GH_PAT@github.com/${{ github.repository }}.git HEAD:main --force; do
          echo "Push failed, retrying in 10s..."
          sleep 10
        done

    - name: Create release for final backup
      env:
        GH_PAT: ${{ secrets.GH_PAT }}
      run: |
        TAG="backup-$(date -u +%Y%m%dT%H%M%SZ)"
        FINAL_ZIP="Backup/minecraft-backup-final.zip"
        zip -r "$FINAL_ZIP" world/ plugins/ config/ || true
        git add -A
        git commit -m "Final backup $TAG" || true
        until git push https://$GH_PAT@github.com/${{ github.repository }}.git HEAD:main --force; do
          echo "Push failed, retrying..."
          sleep 10
        done
        curl -s -X POST \
          -H "Authorization: token $GH_PAT" \
          -H "Content-Type: application/json" \
          -d "{\"tag_name\":\"$TAG\",\"name\":\"Final backup $TAG\",\"body\":\"Auto backup\"}" \
          https://api.github.com/repos/${{ github.repository }}/releases

    - name: Update No-IP (optional)
      env:
        NOIP_USERNAME: ${{ secrets.NOIP_USERNAME }}
        NOIP_PASSWORD: ${{ secrets.NOIP_PASSWORD }}
        NOIP_HOSTNAME: ecrion.qzz.io
        SERVER_IP: ${{ secrets.SERVER_IP }}
      run: |
        echo "Updating No-IP to point to persistent server IP..."
        curl -s "http://$NOIP_USERNAME:$NOIP_PASSWORD@dynupdate.no-ip.com/nic/update?hostname=$NOIP_HOSTNAME&myip=$SERVER_IP" \
             -o noip_update.log
        cat noip_update.log
