name: Minecraft Paper Server with ngrok TCP

on:
  workflow_dispatch:

jobs:
  minecraft:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # ~6 hours max

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: temurin
        java-version: '21'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y curl unzip

    - name: Download PaperMC 1.21.8 build #58
      run: |
        while [ ! -f paper-1.21.8-58.jar ]; do
          curl -fL -o paper-1.21.8-58.jar \
            https://api.papermc.io/v2/projects/paper/versions/1.21.8/builds/58/downloads/paper-1.21.8-58.jar \
            && break
          echo "Download failed, retrying in 15s..."
          sleep 15
        done

    - name: Accept EULA
      run: echo "eula=true" > eula.txt

    - name: Install ngrok
      run: |
        curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc > /dev/null
        echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
        sudo apt-get update && sudo apt-get install -y ngrok

    - name: Run Minecraft Server + ngrok
      env:
        NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
      run: |
        set -euo pipefail

        echo "Starting Minecraft server..."
        java -Xms2G -Xmx2G -jar paper-1.21.8-58.jar nogui &

        echo "Starting ngrok TCP tunnel..."
        ngrok authtoken "$NGROK_AUTHTOKEN"
        ngrok tcp 25565 > ngrok.log 2>&1 &

        sleep 15  # wait for ngrok to initialize

        NGROK_URL=$(grep -o 'tcp://[0-9a-z\.]*:[0-9]*' ngrok.log | head -n 1)
        echo "Minecraft Public TCP Address: $NGROK_URL"
        echo "NGROK_URL=$NGROK_URL" >> $GITHUB_ENV

        # Keep workflow alive so Minecraft & ngrok keep running
        tail -f /dev/null
