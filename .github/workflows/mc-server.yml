name: Minecraft Paper Server with Safe Backup & Auto Shutdown

on:
  workflow_dispatch:

jobs:
  minecraft:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hours

    steps:
    # 1️⃣ Checkout repository
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        persist-credentials: false

    # 2️⃣ Setup environment
    - name: Setup environment
      run: |
        sudo apt-get update
        sudo apt-get install -y zip unzip curl jq

    # 3️⃣ Setup Java 21
    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: temurin
        java-version: '21'

    # 4️⃣ Download Paper jar if missing
    - name: Download Paper 1.21.8 build #58
      run: |
        if [ ! -f paper-1.21.8-58.jar ]; then
          curl -L -o paper-1.21.8-58.jar \
          https://api.papermc.io/v2/projects/paper/versions/1.21.8/builds/58/downloads/paper-1.21.8-58.jar
        fi

    # 5️⃣ Accept EULA
    - name: Accept EULA
      run: echo "eula=true" > eula.txt

    # 6️⃣ Restore latest backup (split zip) if exists
    - name: Restore latest backup
      run: |
        mkdir -p Backup
        LATEST_PREFIX=$(ls Backup 2>/dev/null | grep "mc-backup-" | sed 's/\.zip.*//' | sort -r | head -n1)
        if [ -n "$LATEST_PREFIX" ]; then
          echo "Restoring latest backup: $LATEST_PREFIX"
          cat Backup/${LATEST_PREFIX}.zip* > Backup/${LATEST_PREFIX}-full.zip
          unzip -o Backup/${LATEST_PREFIX}-full.zip -d .
        else
          echo "No backup found, starting fresh server"

    # 7️⃣ Run Minecraft server with scheduled backup & workflow automation
    - name: Run Minecraft Server with Auto Backup
      run: |
        java -Xms14G -Xmx14G -jar paper-1.21.8-58.jar nogui &
        SERVER_PID=$!

        git config --global user.name "Auto Backup Bot"
        git config --global user.email "backup@github.com"
        git remote remove origin || true
        git remote add origin https://$GH_PAT@github.com/Mahirminecraft/Ecrions.git

        for i in $(seq 1 360); do
          sleep 60
          TIMESTAMP=$(date +"%Y-%m-%d_%H-%M-%S")

          # 5h → stop server
          if [ "$i" -eq 300 ]; then
            echo "Stopping Minecraft server at 5h..."
            kill $SERVER_PID
          fi

          # 5h1m → create split backup and push to repo
          if [ "$i" -eq 1 ]; then
            BACKUP_PREFIX="Backup/mc-backup-$TIMESTAMP"
            echo "Creating split backup $BACKUP_PREFIX after server stopped"
            zip -r -s 500m "$BACKUP_PREFIX.zip" world world_nether world_the_end plugins config || echo "Some files skipped"

            # Keep only latest 5 backups in repo
            BACKUPS_TO_DELETE=$(ls Backup | grep "mc-backup-" | sort -r | tail -n +6)
            for file in $BACKUPS_TO_DELETE; do
              rm -f "Backup/$file"
            done

            git add Backup/
            git commit -m "Backup at $TIMESTAMP" || echo "No changes"
            git push origin HEAD:main --force || echo "Push failed"

            # Also upload final backup to Release
            RELEASE_RESPONSE=$(curl -s -X POST \
              -H "Authorization: token $GH_PAT" \
              -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"backup-$TIMESTAMP\",\"name\":\"$BACKUP_PREFIX.zip\",\"body\":\"Auto backup\",\"draft\":false,\"prerelease\":false}" \
              https://api.github.com/repos/Mahirminecraft/Ecrions/releases)

            UPLOAD_URL=$(echo $RELEASE_RESPONSE | jq -r .upload_url | sed -e "s/{?name,label}//")
            curl -X POST \
              -H "Authorization: token $GH_PAT" \
              -H "Content-Type: application/zip" \
              --data-binary @$BACKUP_PREFIX.zip \
              "$UPLOAD_URL?name=$BACKUP_PREFIX.zip"
          fi

          # 5h2m → trigger new workflow
          if [ "$i" -eq 2 ]; then
            echo "Triggering new workflow..."
            curl -X POST \
              -H "Authorization: Bearer $GH_PAT" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/Mahirminecraft/Ecrions/actions/workflows/mc-server.yml/dispatches \
              -d '{"ref":"main"}'
          fi

          # 5h3m → safely exit current workflow
          if [ "$i" -eq 3 ]; then
            echo "Exiting previous workflow safely..."
            exit 0
          fi
        done
      env:
        GH_PAT: ${{ secrets.GH_PAT }}
