name: Minecraft Paper Server Test

on:
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21

      - name: Ensure server files exist
        run: |
          mkdir -p server
          cp -r * server/ || true
          cd server
          if [ ! -f paper-1.21.8-58.jar ]; then
            wget -O paper-1.21.8-58.jar https://api.papermc.io/v2/projects/paper/versions/1.21.8/builds/58/downloads/paper-1.21.8-58.jar
          fi
          echo "eula=true" > eula.txt

      - name: Run server loop (3-min test)
        run: |
          cd server
          for i in {1..3}; do
            echo "⏳ Loop $i / 3"
            
            # Start server (background)
            screen -dmS mc-server java -Xms2G -Xmx2G -jar paper-1.21.8-58.jar nogui
            sleep 60
            screen -S mc-server -X quit || true

            # Commit all files/folders to repo
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "Auto-save (minute $i)" || true
            git push origin main || true

            # Minute 2 → trigger new workflow
            if [ $i -eq 2 ]; then
              echo "⚡ Triggering new workflow..."
              curl -X POST \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
                https://api.github.com/repos/Mahirminecraft/Ecrions/actions/workflows/mc-server-test.yml/dispatches \
                -d '{"ref":"main"}'
            fi

            # Minute 3 → create backup + stop
            if [ $i -eq 3 ]; then
              echo "📦 Creating release backup..."
              zip -r server-backup.zip .
              gh release create "backup-$(date +%Y%m%d-%H%M%S)" server-backup.zip --repo ${{ github.repository }} || true
              echo "🛑 Stopping old workflow"
              exit 0
            fi
          done
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
