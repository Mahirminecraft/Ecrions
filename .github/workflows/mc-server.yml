
name: Minecraft Server

on:
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest
    steps:
      # 1️⃣ Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true

      # 2️⃣ Restore latest backup
      - name: Restore latest backup
        run: |
          mkdir -p Backup
          LATEST_BACKUP=$(ls -t Backup/*.zip 2>/dev/null | head -n 1 || true)
          if [ -n "$LATEST_BACKUP" ]; then
            echo "Restoring backup: $LATEST_BACKUP"
            unzip -o "$LATEST_BACKUP" -d ./
          else
            echo "No backup found, starting fresh world"
          fi

      # 3️⃣ Download PaperMC if missing
      - name: Download PaperMC
        run: |
          PAPER_JAR="paper.jar"
          if [ ! -f $PAPER_JAR ]; then
            VERSION=1.21.1
            BUILD=$(curl -s https://api.papermc.io/v2/projects/paper/versions/$VERSION | jq -r '.builds[-1]')
            URL="https://api.papermc.io/v2/projects/paper/versions/$VERSION/builds/$BUILD/downloads/paper-$VERSION-$BUILD.jar"
            curl -L -o $PAPER_JAR "$URL"
          fi

      # 4️⃣ Accept EULA
      - name: Accept EULA
        run: echo "eula=true" > eula.txt

      # 5️⃣ Start Minecraft server
      - name: Start server
        run: |
          java -Xmx2G -Xms1G -jar paper.jar nogui &
          echo $! > server.pid
          sleep 30
          tail -n 50 logs/latest.log || true

      # 6️⃣ Keep server running for 5 hours
      - name: Keep server running
        run: sleep 18000

      # 7️⃣ Stop server gracefully
      - name: Stop server
        run: |
          if [ -f server.pid ]; then
            kill -15 $(cat server.pid) || true
            wait $(cat server.pid) 2>/dev/null || true
          fi

      # 8️⃣ Create backup in repo
      - name: Create backup
        run: |
          mkdir -p Backup
          TIMESTAMP=$(date +"%Y-%m-%d_%H-%M-%S")
          ZIPFILE="Backup/mc-backup-$TIMESTAMP.zip"
          # Zip all files except .git and Backup folder itself
          zip -r "$ZIPFILE" . -x ".git/*" "Backup/*"
          # Keep only latest 3 backups
          BACKUPS_TO_DELETE=$(ls -t Backup/*.zip | tail -n +4 || true)
          if [ -n "$BACKUPS_TO_DELETE" ]; then
            echo "Deleting old backups:"
            echo "$BACKUPS_TO_DELETE"
            rm -f $BACKUPS_TO_DELETE
          fi

      # 9️⃣ Push backup to repo
      - name: Push backup
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add Backup/*.zip
          git commit -m "Backup at $(date +"%Y-%m-%d_%H-%M-%S")" || echo "No changes"
          git push || true

      # 🔟 Trigger new workflow
      - name: Trigger next workflow
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/mc-server.yml/dispatches \
            -d '{"ref":"main"}'

      # 1️⃣1️⃣ End old workflow safely
      - name: End workflow
        run: |
          echo "Shutting down old workflow..."
          sleep 180
