name: Minecraft + Tailscale Funnel + No-IP SRV

on:
  workflow_dispatch:

jobs:
  minecraft-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Install Java & Tailscale
      run: |
        sudo apt-get update -y
        sudo apt-get install -y openjdk-21-jdk curl unzip zip jq
        curl -fsSL https://tailscale.com/install.sh | sh

    - name: Start Tailscale daemon
      env:
        TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
      run: |
        sudo tailscaled --state=mem:&
        sleep 3
        sudo tailscale up --authkey=$TAILSCALE_AUTH_KEY --hostname=mc-test-server

    - name: Download Paper Minecraft
      run: |
        curl -fL -o paper.jar https://api.papermc.io/v2/projects/paper/versions/1.21.8/builds/58/downloads/paper-1.21.8-58.jar
        echo "eula=true" > eula.txt

    - name: Start Minecraft server
      run: |
        java -Xms2G -Xmx2G -jar paper.jar nogui &
        sleep 5

    - name: Start Tailscale Funnel and get allowed port
      run: |
        # Use HTTPS port allowed by Funnel (e.g., 8443)
        FUNNEL_OUTPUT=$(sudo tailscale funnel --bg --https 8443 127.0.0.1:25565)
        echo "$FUNNEL_OUTPUT"

        # Extract Funnel hostname
        FUNNEL_URL=$(echo "$FUNNEL_OUTPUT" | grep "Available on the internet:" | awk '{print $4}')
        if [ -z "$FUNNEL_URL" ]; then
          echo "Error: Funnel hostname not found"
          exit 1
        fi

        FUNNEL_HOST=$(echo $FUNNEL_URL | sed 's|https://||' | sed 's|/||')
        FUNNEL_PORT=8443  # Funnel allowed port

        echo "Funnel hostname: $FUNNEL_HOST, port: $FUNNEL_PORT"

        # Update No-IP A record to Funnel IP (dynamic IP)
        curl -s "http://${{ secrets.NOIP_USERNAME }}:${{ secrets.NOIP_PASSWORD }}@dynupdate.no-ip.com/nic/update?hostname=ecrion.ddns.net&myip=$FUNNEL_HOST" \
             -o noip_update.log
        cat noip_update.log

        echo "Set SRV record in No-IP:"
        echo "_minecraft._tcp.ecrion.ddns.net -> $FUNNEL_HOST:$FUNNEL_PORT"

    - name: Keep Minecraft server alive for testing
      run: sleep 3600
