name: Minecraft Paper Server Rolling with Controller (Test Mode)

on:
  workflow_dispatch:

jobs:
  minecraft:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # short for test

    steps:
    # 1️⃣ Checkout repo
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        persist-credentials: false

    # 2️⃣ Setup Java 21
    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: temurin
        java-version: '21'

    # 3️⃣ Ensure Paper jar exists
    - name: Download Paper 1.21.8 build #58
      run: |
        if [ ! -f paper-1.21.8-58.jar ]; then
          curl -L -o paper-1.21.8-58.jar https://api.papermc.io/v2/projects/paper/versions/1.21.8/builds/58/downloads/paper-1.21.8-58.jar
        fi

    # 4️⃣ Accept EULA
    - name: Accept EULA
      run: echo "eula=true" > eula.txt

    # 5️⃣ Restore latest backups (or skip if none)
    - name: Restore latest backups
      run: |
        mkdir -p Backup
        RESTORED=0
        for PART in {1..4}; do
          FILE="Backup/${PART}.Backup-latest.zip"
          if [ -f "$FILE" ]; then
            echo "Restoring $FILE..."
            unzip -o "$FILE" -d ./
            RESTORED=1
          fi
        done
        if [ $RESTORED -eq 0 ]; then
          echo "No latest backups found. Will create new backups."
        fi

    # 6️⃣ Wait a few seconds before starting server
    - name: Wait before starting server
      run: sleep 5

    # 7️⃣ Run Minecraft server with fast test backups
    - name: Run Minecraft Server with Test Backups
      env:
        GH_PAT: ${{ secrets.GH_PAT }}
      run: |
        mkdir -p Backup

        # Git configuration
        git config --global user.name "Auto Save Bot"
        git config --global user.email "autosave@github.com"
        git remote set-url origin https://$GH_PAT@github.com/Mahirminecraft/Ecrions.git

        # Start Minecraft server in background
        java -Xms2G -Xmx2G -jar paper-1.21.8-58.jar nogui &

        # Backup loop: every 15 seconds for test (2 cycles)
        for i in {1..2}; do
          sleep 15

          # Delete previous backups
          for PART in {1..4}; do
            if [ -f "Backup/${PART}.Backup-previous.zip" ]; then
              rm -f "Backup/${PART}.Backup-previous.zip"
            fi
          done

          # Rename latest to previous
          for PART in {1..4}; do
            if [ -f "Backup/${PART}.Backup-latest.zip" ]; then
              mv "Backup/${PART}.Backup-latest.zip" "Backup/${PART}.Backup-previous.zip"
            fi
          done

          # Create new latest backups (skip locked files)
          for PART in {1..4}; do
            ZIP_NAME="Backup/${PART}.Backup-latest.zip"
            zip -r $ZIP_NAME world/ plugins/ config/ || echo "Skipped some files, continuing..."
          done

          # Commit and push
          git add Backup/
          git commit -m "Test backup cycle $i" || echo "No changes"
          git push origin HEAD:main --force || echo "Push failed"
        done

        # 30s: Stop server and create final 4 backups
        echo "Stopping server for final backup..."
        pkill -f "paper-1.21.8-58.jar"

        for PART in {1..4}; do
          FINAL_ZIP="Backup/Backup${PART}.zip"
          zip -r $FINAL_ZIP world/ plugins/ config/
        done

        git add Backup/Backup*.zip
        git commit -m "Final 4 backups (Test Mode)" || echo "No changes"
        git push origin HEAD:main --force || echo "Push failed"

        # 45s: Trigger new workflow
        echo "Triggering new workflow..."
        sleep 15
        curl -X POST \
          -H "Authorization: Bearer $GH_PAT" \
          -H "Accept: application/vnd.github+json" \
          https://api.github.com/repos/Mahirminecraft/Ecrions/actions/workflows/mc-server.yml/dispatches \
          -d '{"ref":"main"}'

        # 60s: Exit workflow
        echo "Stopping workflow..."
        sleep 15
        echo "Test workflow complete."
