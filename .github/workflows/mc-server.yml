name: Minecraft Paper Server with Rolling Backups

on:
  workflow_dispatch:

jobs:
  minecraft:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hours

    steps:
    # 1️⃣ Checkout repo with LFS
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        persist-credentials: false
        lfs: true

    # 2️⃣ Setup environment
    - name: Setup environment
      run: |
        sudo apt-get update
        sudo apt-get install -y git-lfs zip unzip curl jq
        git lfs install

    # 3️⃣ Setup Java
    - name: Setup Java 21
      uses: actions/setup-java@v3
      with:
        distribution: temurin
        java-version: '21'

    # 4️⃣ Download Paper jar if missing
    - name: Download Paper 1.21.8 build #58
      run: |
        if [ ! -f paper-1.21.8-58.jar ]; then
          curl -L -o paper-1.21.8-58.jar \
            https://api.papermc.io/v2/projects/paper/versions/1.21.8/builds/58/downloads/paper-1.21.8-58.jar
        fi

    # 5️⃣ Accept EULA
    - name: Accept EULA
      run: echo "eula=true" > eula.txt

    # 6️⃣ Restore latest backup if exists
    - name: Restore latest backup
      run: |
        mkdir -p Backup
        LATEST_PREFIX=$(ls Backup | grep "mc-backup-" | sed 's/\.zip.*//' | sort -r | head -n1)
        if [ -n "$LATEST_PREFIX" ]; then
          echo "Restoring backup: $LATEST_PREFIX"
          cat Backup/${LATEST_PREFIX}.zip* > Backup/${LATEST_PREFIX}-full.zip
          unzip -o Backup/${LATEST_PREFIX}-full.zip -d .
        else
          echo "No backup found, starting fresh server"
        fi

    # 7️⃣ Run server + scheduled backups + shutdown workflow
    - name: Run Minecraft Server with Backups
      run: |
        java -Xms14G -Xmx14G -jar paper-1.21.8-58.jar nogui &
        SERVER_PID=$!

        git config --global user.name "Backup Bot"
        git config --global user.email "backup@github.com"
        git remote remove origin || true
        git remote add origin https://$GH_PAT@github.com/Mahirminecraft/Ecrions.git

        for i in $(seq 1 360); do
          sleep 60
          TIMESTAMP=$(date +"%Y-%m-%d_%H-%M-%S")

          # Every 30 min → rolling backup
          if [ $((i % 30)) -eq 0 ]; then
            BACKUP_PREFIX="mc-backup-$TIMESTAMP"
            echo "Creating rolling backup: $BACKUP_PREFIX"
            mkdir -p Backup
            zip -r -s 500m Backup/$BACKUP_PREFIX.zip world/ world_nether/ world_the_end/ plugins/ config/ || true

            # Keep only 5 latest backups (20 files max)
            cd Backup
            ls -t | grep "mc-backup-" | sed -e '1,20d' | xargs -r rm -f
            cd ..

            git add Backup/
            git commit -m "Rolling backup at $TIMESTAMP" || echo "No changes"
            git push origin HEAD:main --force || echo "Push failed"

            # Also upload to Release
            RELEASE=$(curl -s -X POST \
              -H "Authorization: token $GH_PAT" \
              -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"backup-$TIMESTAMP\",\"name\":\"$BACKUP_PREFIX\",\"body\":\"Auto backup $TIMESTAMP\"}" \
              https://api.github.com/repos/Mahirminecraft/Ecrions/releases)
            UPLOAD_URL=$(echo $RELEASE | jq -r .upload_url | sed "s/{?name,label}//")
            for FILE in Backup/$BACKUP_PREFIX.zip*; do
              curl -s -X POST \
                -H "Authorization: token $GH_PAT" \
                -H "Content-Type: application/zip" \
                --data-binary @$FILE \
                "$UPLOAD_URL?name=$(basename $FILE)"
            done
          fi

          # 5h → final backup + stop server
          if [ "$i" -eq 300 ]; then
            echo "Final backup at 5h before shutdown..."
            BACKUP_PREFIX="mc-backup-$TIMESTAMP"
            zip -r -s 500m Backup/$BACKUP_PREFIX.zip world/ world_nether/ world_the_end/ plugins/ config/ || true

            # Keep only 5 latest
            cd Backup
            ls -t | grep "mc-backup-" | sed -e '1,20d' | xargs -r rm -f
            cd ..

            git add Backup/
            git commit -m "Final backup at $TIMESTAMP" || echo "No changes"
            git push origin HEAD:main --force || echo "Push failed"

            # Release upload
            RELEASE=$(curl -s -X POST \
              -H "Authorization: token $GH_PAT" \
              -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"backup-$TIMESTAMP\",\"name\":\"$BACKUP_PREFIX\",\"body\":\"Final backup at $TIMESTAMP\"}" \
              https://api.github.com/repos/Mahirminecraft/Ecrions/releases)
            UPLOAD_URL=$(echo $RELEASE | jq -r .upload_url | sed "s/{?name,label}//")
            for FILE in Backup/$BACKUP_PREFIX.zip*; do
              curl -s -X POST \
                -H "Authorization: token $GH_PAT" \
                -H "Content-Type: application/zip" \
                --data-binary @$FILE \
                "$UPLOAD_URL?name=$(basename $FILE)"
            done

            echo "Stopping Minecraft server..."
            kill $SERVER_PID
          fi

          # 5h1m → trigger new workflow
          if [ "$i" -eq 301 ]; then
            echo "Triggering new workflow..."
            curl -X POST \
              -H "Authorization: Bearer $GH_PAT" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/Mahirminecraft/Ecrions/actions/workflows/mc-server.yml/dispatches \
              -d '{"ref":"main"}'
          fi

          # 5h2m → exit old workflow
          if [ "$i" -eq 302 ]; then
            echo "Exiting old workflow at 5h2m"
            exit 0
          fi
        done
      env:
        GH_PAT: ${{ secrets.GH_PAT }}
