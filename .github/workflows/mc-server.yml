name: Test Minecraft IP via Tailscale Funnel + No-IP

on:
  workflow_dispatch:

jobs:
  minecraft-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Install Java & Tailscale
      run: |
        sudo apt-get update -y
        sudo apt-get install -y openjdk-21-jdk curl unzip zip jq
        curl -fsSL https://tailscale.com/install.sh | sh

    - name: Start Tailscale daemon
      env:
        TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
      run: |
        sudo tailscaled --state=mem:&
        sleep 3
        sudo tailscale up --authkey=$TAILSCALE_AUTH_KEY --hostname=mc-test-server

    - name: Download Paper Minecraft
      run: |
        curl -fL -o paper.jar https://api.papermc.io/v2/projects/paper/versions/1.21.8/builds/58/downloads/paper-1.21.8-58.jar
        echo "eula=true" > eula.txt

    - name: Start HTTPS Funnel on allowed port 8443
      run: |
        sudo tailscale funnel --bg --https 8443
        sleep 10
        FUNNEL_URL=$(tailscale funnel status | grep "Available on the internet" | awk '{print $3}')
        echo "Funnel URL: $FUNNEL_URL"
        FUNNEL_HOST=$(echo $FUNNEL_URL | sed 's|https://||' | sed 's|/||')

        echo "Updating No-IP domain..."
        curl -s "http://${{ secrets.NOIP_USERNAME }}:${{ secrets.NOIP_PASSWORD }}@dynupdate.no-ip.com/nic/update?hostname=ecrion.qzz.io&myip=$FUNNEL_HOST" \
             -o noip_update.log
        cat noip_update.log

    - name: Start Minecraft server
      run: |
        java -Xms2G -Xmx2G -jar paper.jar nogui &
        echo "Minecraft server started. Connect using:"
        echo "- No-IP domain: ecrion.qzz.io:25565"
        echo "- Funnel hostname (HTTPS 8443, internal mapping): $FUNNEL_HOST:8443"
        sleep 3600  # keep workflow alive for testing
