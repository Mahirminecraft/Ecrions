name: Minecraft Paper Server Rolling with Controller

on:
  workflow_dispatch:

jobs:
  minecraft:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # max 6 hours

    steps:
    # 1️⃣ Checkout repo
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        persist-credentials: false

    # 2️⃣ Setup Java 21
    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: temurin
        java-version: '21'

    # 3️⃣ Ensure Paper jar exists
    - name: Download Paper 1.21.8 build #58
      run: |
        if [ ! -f paper-1.21.8-58.jar ]; then
          curl -L -o paper-1.21.8-58.jar https://api.papermc.io/v2/projects/paper/versions/1.21.8/builds/58/downloads/paper-1.21.8-58.jar
        fi

    # 4️⃣ Accept EULA
    - name: Accept EULA
      run: echo "eula=true" > eula.txt

    # 5️⃣ Restore latest backups (robust)
    - name: Restore latest backups
      run: |
        mkdir -p Backup
        RESTORED=0
        for PART in {1..4}; do
          FILE="Backup/${PART}.Backup-latest.zip"
          if [ -f "$FILE" ]; then
            echo "Restoring $FILE..."
            unzip -o "$FILE" -d ./ || echo "Warning: $FILE could not be fully extracted, continuing..."
            RESTORED=1
          else
            echo "$FILE not found, skipping..."
          fi
        done
        if [ $RESTORED -eq 0 ]; then
          echo "No latest backups found. Will create new backups."
        fi

    # 6️⃣ Wait a few seconds before starting server
    - name: Wait before starting server
      run: sleep 10

    # 6️⃣a Update No-IP Dynamic DNS
    - name: Update No-IP Dynamic DNS
      run: |
        SERVER_IP=$(curl -s https://api.ipify.org)
        echo "Public IP: $SERVER_IP"
        curl -u "${{ secrets.NOIP_USERNAME }}:${{ secrets.NOIP_PASSWORD }}" \
        "https://dynupdate.no-ip.com/nic/update?hostname=ecrion.ddns.net&myip=$SERVER_IP"

    # 7️⃣ Run Minecraft server with backups
    - name: Run Minecraft Server with Backups and Controller Logic
      env:
        GH_PAT: ${{ secrets.GH_PAT }}
      run: |
        mkdir -p Backup

        # Git configuration
        git config --global user.name "Auto Save Bot"
        git config --global user.email "autosave@github.com"
        git remote set-url origin https://$GH_PAT@github.com/Mahirminecraft/Ecrions.git

        # Start Minecraft server in background
        java -Xms16G -Xmx16G -jar paper-1.21.8-58.jar nogui &

        # Backup loop: every 30 minutes for 5 hours (10 cycles)
        for i in {1..10}; do
          sleep 1800  # 30 minutes

          # Step 1: Delete previous backups
          for PART in {1..4}; do
            if [ -f "Backup/${PART}.Backup-previous.zip" ]; then
              rm -f "Backup/${PART}.Backup-previous.zip"
            fi
          done

          # Step 2: Rename current latest backups to previous
          for PART in {1..4}; do
            if [ -f "Backup/${PART}.Backup-latest.zip" ]; then
              mv "Backup/${PART}.Backup-latest.zip" "Backup/${PART}.Backup-previous.zip"
            fi
          done

          # Step 3: Create 4 new latest backups
          for PART in {1..4}; do
            ZIP_NAME="Backup/${PART}.Backup-latest.zip"
            zip -r $ZIP_NAME world/ plugins/ config/ || echo "Skipped some files, continuing..."
          done

          # Commit and push backups to repo
          git add Backup/
          git commit -m "Backup cycle $i" || echo "No changes"
          git push origin HEAD:main --force || echo "Push failed"
        done
