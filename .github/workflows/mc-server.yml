name: Minecraft Paper Server Rolling - Test Mode

on:
  workflow_dispatch:

jobs:
  minecraft:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # enough for short test

    steps:
    # 1️⃣ Checkout repo
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        persist-credentials: false

    # 2️⃣ Setup Java 21
    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: temurin
        java-version: '21'

    # 3️⃣ Ensure Paper jar exists
    - name: Download Paper 1.21.8 build #58
      run: |
        if [ ! -f paper-1.21.8-58.jar ]; then
          curl -L -o paper-1.21.8-58.jar https://api.papermc.io/v2/projects/paper/versions/1.21.8/builds/58/downloads/paper-1.21.8-58.jar
        fi

    # 4️⃣ Accept EULA
    - name: Accept EULA
      run: echo "eula=true" > eula.txt

    # 5️⃣ Wait 5 seconds before starting server (optional)
    - name: Wait before starting server
      run: sleep 5

    # 6️⃣ Run Minecraft Server with Backups (Testing)
    - name: Run Minecraft Server - Test Mode
      env:
        GH_PAT: ${{ secrets.GH_PAT }}
      run: |
        mkdir -p Backup

        # Keep only latest 2 backup cycles (8 files)
        BACKUPS=$(ls -1tr Backup | grep 'backup' | sort)
        COUNT=$(echo "$BACKUPS" | wc -l)
        if [ $COUNT -gt 8 ]; then
          TO_DELETE=$(echo "$BACKUPS" | head -n $(($COUNT - 8)))
          echo "Deleting old backup files:"
          echo "$TO_DELETE"
          echo "$TO_DELETE" | xargs -I {} rm -f Backup/{}
        fi

        # Start Minecraft server in background
        java -Xms1G -Xmx1G -jar paper-1.21.8-58.jar nogui &

        # Backup loop: every 30 seconds, 2 cycles for testing
        for i in {1..2}; do
          sleep 30  # 30-second interval

          # Create 4 incremental backups
          for PART in {1..4}; do
            ZIP_NAME="Backup/${PART}-backup-$(date +'%Y-%m-%d_%H-%M-%S').zip"
            zip -r $ZIP_NAME world/ plugins/ config/
          done

          # Remove old incremental files beyond 2 cycles (latest 8 files)
          BACKUPS=$(ls -1tr Backup | grep 'backup' | sort)
          COUNT=$(echo "$BACKUPS" | wc -l)
          if [ $COUNT -gt 8 ]; then
            TO_DELETE=$(echo "$BACKUPS" | head -n $(($COUNT - 8)))
            echo "Deleting old backup files:"
            echo "$TO_DELETE"
            echo "$TO_DELETE" | xargs -I {} rm -f Backup/{}
          fi

          # Commit and push incremental backups
          git config --global user.name "Auto Save Bot"
          git config --global user.email "autosave@github.com"
          git add Backup/
          git commit -m "Backup at $(date +"%Y-%m-%d %H:%M:%S")" || echo "No changes"
          git push origin HEAD:main --force || echo "Push failed"
        done

        # 1 min: Stop server and create final backup
        echo "1 minute reached, stopping server..."
        FINAL_ZIP="minecraft-backup-final-$(date +'%Y-%m-%d_%H-%M-%S').zip"
        zip -r $FINAL_ZIP world/ plugins/ config/
        pkill -f "paper-1.21.8-58.jar"

        # Push final backup to repo
        git add $FINAL_ZIP
        git commit -m "Final backup at $(date +"%Y-%m-%d_%H-%M-%S")" || echo "No changes"
        git push origin HEAD:main --force || echo "Push failed"

        # 2 min: Trigger new workflow
        echo "Triggering new workflow..."
        curl -X POST \
          -H "Authorization: Bearer $GH_PAT" \
          -H "Accept: application/vnd.github+json" \
          https://api.github.com/repos/Mahirminecraft/Ecrions/actions/workflows/mc-server.yml/dispatches \
          -d '{"ref":"main"}'

        # 3 min: Exit workflow
        echo "Waiting 1 minute before exiting workflow..."
        sleep 60
        echo "Exiting test workflow."
