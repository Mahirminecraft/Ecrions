name: Minecraft Server

on:
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true

      # ---------------- RESTORE LATEST BACKUP ----------------
      - name: Restore latest backup
        run: |
          mkdir -p Backup
          LATEST_BACKUP=$(ls -t Backup/*.zip 2>/dev/null | head -n 1 || true)
          if [ -n "$LATEST_BACKUP" ]; then
            echo "Restoring backup: $LATEST_BACKUP"
            unzip -o "$LATEST_BACKUP" -d ./
          else
            echo "No backup found, starting fresh world"
          fi

      # ---------------- DOWNLOAD PAPER ----------------
      - name: Download PaperMC
        run: |
          PAPER_JAR="paper.jar"
          if [ ! -f $PAPER_JAR ]; then
            VERSION=1.21.1
            BUILD=$(curl -s https://api.papermc.io/v2/projects/paper/versions/$VERSION | jq -r '.builds[-1]')
            URL="https://api.papermc.io/v2/projects/paper/versions/$VERSION/builds/$BUILD/downloads/paper-$VERSION-$BUILD.jar"
            curl -L -o $PAPER_JAR "$URL"
          fi

      - name: Accept EULA
        run: echo "eula=true" > eula.txt

      # ---------------- START SERVER ----------------
      - name: Start Minecraft Server
        run: |
          java -Xmx16G -Xms16G -jar paper.jar nogui &
          SERVER_PID=$!
          echo $SERVER_PID > server.pid
          sleep 30
          tail -n 50 logs/latest.log || true

      # ---------------- RUN FOR 5h ----------------
      - name: Keep server running for 5h
        run: sleep 18000   # 5 hours

      # ---------------- STOP SERVER ----------------
      - name: Stop server
        run: |
          if [ -f server.pid ]; then
            kill $(cat server.pid) || true
          fi

      # ---------------- CREATE BACKUP ----------------
      - name: Create Backup
        run: |
          mkdir -p Backup
          TIMESTAMP=$(date +"%Y-%m-%d_%H-%M-%S")
          ZIPFILE="Backup/mc-backup-$TIMESTAMP.zip"
          zip -r "$ZIPFILE" . -x ".git/*" "Backup/*"

      - name: Push Backup to Repo
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add Backup/*.zip
          git commit -m "Backup at $(date +"%Y-%m-%d_%H-%M-%S")" || echo "No changes to commit"
          git push

      # ---------------- TRIGGER NEW WORKFLOW ----------------
      - name: Trigger new workflow
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/mc-server.yml/dispatches \
            -d '{"ref":"main"}'

      # ---------------- SHUTDOWN ----------------
      - name: Shutdown job
        run: exit 0
