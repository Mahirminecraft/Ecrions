name: Restart Minecraft Workflow

on:
  workflow_dispatch:

jobs:
  restart:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger mc-server.yml
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}   # <-- use your PAT here
        run: |
          echo "Triggering new workflow..."
          curl -X POST \
            -H "Authorization: Bearer $GH_PAT" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Mahirminecraft/Ecrions/actions/workflows/mc-server.yml/dispatches \
            -d '{"ref":"main"}'
