name: Artifact + Skyport Panel Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Install dependencies
      run: |
        sudo apt-get update -y
        sudo apt-get install -y curl unzip nodejs npm
        sudo npm install -g pm2

    - name: Restore latest artifact
      run: |
        echo "Fetching latest artifact..."
        ARTIFACT_ID=$(curl -s -H "Authorization: token ${{ secrets.GH_PAT }}" \
          https://api.github.com/repos/${{ github.repository }}/actions/artifacts \
          | jq -r '.artifacts | sort_by(.created_at) | reverse | .[0].id')
        if [ "$ARTIFACT_ID" != "null" ]; then
          curl -sL -H "Authorization: token ${{ secrets.GH_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            -o artifact.zip \
            https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip
          unzip -o artifact.zip -d ./
          echo "✅ Artifact restored"
        else
          echo "❌ No artifact found"
        fi

    - name: Install Skyport Panel + Wings
      run: |
        sudo su -c "bash <(curl -s https://raw.githubusercontent.com/JishnuTheGamer/skyport/refs/heads/main/panel)"
        sudo su -c "bash <(curl -s https://raw.githubusercontent.com/JishnuTheGamer/skyport/refs/heads/main/wings)"
        cd skyportd
        pm2 start . || true

    - name: Upload test artifact
      uses: actions/upload-artifact@v4
      with:
        name: test-artifact-${{ github.run_number }}
        path: ./skyportd
        retention-days: 7
