name: Minecraft Server with LocalXpose (TCP Tunnel)

on:
  workflow_dispatch:

jobs:
  minecraft:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      LXP_TOKEN: ${{ secrets.LXP_TOKEN }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '21'

      - name: Install tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y curl unzip zip jq dnsutils

      - name: Download PaperMC Server
        run: |
          while [ ! -f paper.jar ]; do
            curl -fL -o paper.jar \
              https://api.papermc.io/v2/projects/paper/versions/1.21.8/builds/58/downloads/paper-1.21.8-58.jar \
              && break
            echo "Retry download in 10s..."
            sleep 10
          done
          echo "eula=true" > eula.txt

      - name: Start Minecraft Server
        run: |
          nohup java -Xms1G -Xmx2G -jar paper.jar nogui > mc.log 2>&1 &
          echo "Minecraft server started."

      - name: Install LocalXpose CLI
        run: |
          curl -Lo loclx.gz https://github.com/localxpose/localxpose/releases/download/v0.14.1/loclx_0.14.1_linux_amd64.tar.gz
          tar -xzf loclx.gz
          chmod +x loclx
          sudo mv loclx /usr/local/bin/localxpose
          echo "LocalXpose installed: $(localxpose --version)"

      - name: Login to LocalXpose
        run: |
          localxpose account login --token "$LXP_TOKEN"
          echo "Logged into LocalXpose successfully."

      - name: Start LocalXpose TCP Tunnel
        run: |
          nohup localxpose tunnel tcp --to localhost:25565 --json > loclx.json 2>&1 &
          sleep 20

      - name: Display Public IP:Port
        run: |
          cat loclx.json
          ADDR=$(jq -r '.url' loclx.json || true)
          echo "========================================"
          echo " Minecraft Server Public Address:"
          if [ -n "$ADDR" ] && [ "$ADDR" != "null" ]; then
            echo "$ADDR"
          else
            echo "❌ No TCP tunnel address found"
          fi
          echo "========================================"

      - name: Keep workflow alive
        run: sleep infinity
