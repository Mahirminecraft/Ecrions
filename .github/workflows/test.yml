name: Minecraft Server with LocalXpose

on:
  workflow_dispatch:

jobs:
  minecraft:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      - name: Download Minecraft server
        run: |
          mkdir server
          cd server
          curl -o server.jar https://piston-data.mojang.com/v1/objects/8a021f38cce96c260a48f9d18ad1d5eb6f7f02c7/server.jar
          echo "eula=true" > eula.txt

      - name: Start Minecraft server
        run: |
          cd server
          nohup java -Xmx1024M -Xms1024M -jar server.jar nogui > server.log 2>&1 &

      - name: Install LocalXpose
        run: |
          curl -Lo loclx.tar.gz https://github.com/localxpose/localxpose/releases/download/v0.14.1/loclx_0.14.1_linux_amd64.tar.gz
          tar -xzf loclx.tar.gz
          chmod +x loclx
          sudo mv loclx /usr/local/bin/loclx

      - name: Login LocalXpose
        run: |
          echo "${{ secrets.LXP_TOKEN }}" | loclx account login --token

      - name: Start LocalXpose TCP Tunnel
        run: |
          nohup loclx tunnel tcp --to localhost:25565 > loclx.log 2>&1 &
          sleep 15

      - name: Display Public IP:Port
        run: |
          ADDR=$(grep -oE 'tcp://[^ ]*' loclx.log | head -n1)
          echo "========================================"
          echo " Minecraft Server Public Address:"
          echo "$ADDR"
          echo "========================================"
