name: Controller Workflow

on:
  workflow_dispatch:

jobs:
  trigger-mc-server:
    runs-on: ubuntu-latest
    steps:
      - name: Wait 30 seconds
        run: sleep 30

      - name: Trigger test workflow
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          curl -X POST \
            -H "Authorization: Bearer $GH_PAT" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Mahirminecraft/Ecrions/actions/workflows/test.yml/dispatches \
            -d '{"ref":"main"}'

      - name: Run only for 30 more seconds (then stop)
        run: |
          echo "Controller will stop in 30s..."
          sleep 30
          echo "Exiting now."
