name: Minecraft Paper Server (MEGA Overwrite) — Final to GitHub Release

on:
  workflow_dispatch:

permissions:
  contents: write    # To create releases and upload assets
  actions: write     # To auto-restart the workflow

jobs:
  minecraft:
    runs-on: ubuntu-latest
    timeout-minutes: 370

    steps:
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'

    - name: Install tools
      run: |
        sudo apt-get update -y
        sudo apt-get install -y zip unzip jq curl dnsutils

    - name: Setup rclone (MEGA)
      env:
        MEGA_EMAIL: ${{ secrets.MEGA_EMAIL }}
        MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}
        MEGA_REMOTE_PATH: ${{ secrets.MEGA_REMOTE_PATH }}
      run: |
        set -e
        if [ -z "${MEGA_EMAIL:-}" ] || [ -z "${MEGA_PASSWORD:-}" ]; then
          echo "Missing secrets: MEGA_EMAIL and/or MEGA_PASSWORD"; exit 1
        fi

        curl -fsSL https://rclone.org/install.sh | sudo bash
        OBSCURED=$(rclone obscure "$MEGA_PASSWORD")
        echo "RCLONE_CONFIG_MEGA_TYPE=mega" >> $GITHUB_ENV
        echo "RCLONE_CONFIG_MEGA_USER=$MEGA_EMAIL" >> $GITHUB_ENV
        echo "RCLONE_CONFIG_MEGA_PASS=$OBSCURED" >> $GITHUB_ENV

        REMOTE="${MEGA_REMOTE_PATH:-mega:mcserver}"
        echo "REMOTE=$REMOTE" >> $GITHUB_ENV

        # Ensure the main directory exists. If not, it's a fresh start.
        if ! rclone lsd "$REMOTE" >/dev/null 2>&1; then
          echo "Remote path '$REMOTE' does not exist. Creating new files."
          rclone mkdir "$REMOTE/current" || true
        fi

    - name: Download latest Paper build
      run: |
        set -e
        VERSION=$(curl -fsSL https://api.papermc.io/v2/projects/paper | jq -r '.versions[-1]')
        META=$(curl -fsSL "https://api.papermc.io/v2/projects/paper/versions/$VERSION/builds")
        BUILD=$(echo "$META" | jq -r '.builds[-1].build')
        JAR="paper-$VERSION-$BUILD.jar"
        URL="https://api.papermc.io/v2/projects/paper/versions/$VERSION/builds/$BUILD/downloads/$JAR"

        echo "Downloading $JAR ..."
        until curl -fL -o "$JAR" "$URL"; do
          echo "Download failed, retrying in 15s..."
          sleep 15
        done
        echo "SERVER_JAR=$JAR" >> $GITHUB_ENV

    - name: Accept EULA
      run: echo "eula=true" > eula.txt

    - name: Restore from MEGA (Full Overwrite)
      run: |
        set -e
        if rclone lsf "$REMOTE/current" --max-depth 1 | grep -q .; then
          echo "Found previous backup. Downloading all files and overwriting local..."
          # --ignore-existing forces rclone to copy all files, even if they match
          rclone copy --ignore-existing "$REMOTE/current" . --create-empty-src-dirs -v
        else
          echo "No previous backup found on MEGA. Starting fresh."
        fi

    - name: Install ngrok
      run: |
        curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc > /dev/null
        echo "deb https://ngrok-agent.s3.amazonaws.com stable main" | sudo tee /etc/apt/sources.list.d/ngrok.list
        sudo apt-get update && sudo apt-get install -y ngrok

    - name: Start Minecraft Server
      run: |
        echo "Starting Minecraft server..."
        java -Xms2G -Xmx6G -jar "$SERVER_JAR" nogui &
        echo $! > mc.pid

    - name: Start ngrok, get address, and notify (optional)
      env:
        NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        NOIP_USER: ${{ secrets.NOIP_USERNAME }}
        NOIP_PASS: ${{ secrets.NOIP_PASSWORD }}
        NOIP_HOST: ${{ secrets.NOIP_HOSTNAME }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        if [ -n "$NGROK_AUTHTOKEN" ]; then ngrok authtoken "$NGROK_AUTHTOKEN" || true; fi
        nohup ngrok tcp 25565 > ngrok.log 2>&1 &
        sleep 10
        NGROK_URL=$(curl -s http://127.0.0.1:4040/api/tunnels | jq -r '.tunnels[]? | select(.public_url | startswith("tcp://")) | .public_url' | head -n1 || true)
        if [ -z "$NGROK_URL" ]; then exit 0; fi
        HOST=$(echo "$NGROK_URL" | sed -E 's#tcp://([^:]+):.*#\1#')
        PORT=$(echo "$NGROK_URL" | sed -E 's#tcp://[^:]+:([0-9]+)#\1#')
        IP=$(dig +short "$HOST" | head -n 1)
        echo "### Minecraft Address" >> $GITHUB_STEP_SUMMARY
        echo "- Hostname: \`$HOST:$PORT\`" >> $GITHUB_STEP_SUMMARY
        if [ -n "$NOIP_USER" ] && [ -n "$IP" ]; then
          curl -s -u "$NOIP_USER:$NOIP_PASS" "http://dynupdate.no-ip.com/nic/update?hostname=$NOIP_HOST&myip=$IP" || true
        fi
        if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
          ADDRESS="${NOIP_HOST:-$HOST}:$PORT"
          MESSAGE="🎮 Minecraft server is LIVE!\n\nConnect at:\n🌐 $ADDRESS"
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" -d chat_id="$TELEGRAM_CHAT_ID" -d text="$MESSAGE" >/dev/null
        fi

    - name: Rolling Overwrite to MEGA and final backup to GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail

        # Define which folders to always upload
        COPY_FLAGS="--include /world/** --include /plugins/** --include /config/**"

        # 10 cycles × 30 minutes ≈ 5 hours
        for i in {1..10}; do
          sleep 1800
          echo "=== Backup cycle $i (Full Overwrite) ==="

          # Unconditionally re-upload all server files, overwriting the destination
          until rclone copy --ignore-existing . "$REMOTE/current" $COPY_FLAGS \
            -v --transfers 8 --checkers 16 --mega-hard-delete; do
            echo "Upload failed, retrying in 15s..."
            sleep 15
          done
        done

        echo "=== Final Overwrite and Backup at ~5h ==="
        # Perform one last full upload to MEGA
        rclone copy --ignore-existing . "$REMOTE/current" $COPY_FLAGS \
          -v --transfers 8 --checkers 16 --mega-hard-delete

        TS=$(date -u +%Y%m%dT%H%M%SZ)

        # Also copy the final state to a permanent, timestamped folder on MEGA
        rclone copy "$REMOTE/current" "$REMOTE/Finals/backup-$TS" -v

        # Zip the local files for the GitHub Release
        FINAL_ZIP="minecraft-backup-$TS.zip"
        zip -rq "$FINAL_ZIP" world/ plugins/ config/ || true

        # Create GitHub Release and upload the final zip
        gh release create "backup-$TS" "$FINAL_ZIP" \
          --title "Final backup $TS" \
          --notes "Automated final backup. See MEGA for the latest server state: $REMOTE/current"

        # Auto-restart the workflow
        sleep 60
        gh workflow run "$(basename "${{ github.workflow_ref }}")" --ref main || echo "Redispatch failed."
        
        # Stop current server
        sleep 60
        kill -9 "$(cat mc.pid)" || true
        echo "Workflow finished."
