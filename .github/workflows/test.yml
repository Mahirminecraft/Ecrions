name: Minecraft Paper Server + LocalXpose

on:
  workflow_dispatch:

jobs:
  minecraft:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      LXP_TOKEN: ${{ secrets.LXP_TOKEN }}

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: temurin
        java-version: '21'

    - name: Install essential tools
      run: |
        sudo apt-get update -y
        sudo apt-get install -y zip unzip jq curl dnsutils

    - name: Download PaperMC Server
      run: |
        while [ ! -f paper-1.21.8-58.jar ]; do
          curl -O -L https://api.papermc.io/v2/projects/paper/versions/1.21.8/builds/58/downloads/paper-1.21.8-58.jar
          sleep 5
        done
        echo "eula=true" > eula.txt

    - name: Start Minecraft Server
      run: |
        java -Xms16G -Xmx16G -jar paper-1.21.8-58.jar nogui &
        echo $! > mc.pid

    - name: Start LocalXpose Tunnel
      id: loclx
      uses: LocalXpose/localxpose-action@v1
      with:
        token: ${{ secrets.LXP_TOKEN }}
        port: 25565
        proto: tcp

    - name: Display Public IP:Port
      run: |
        echo "========================================"
        echo " Minecraft Server Public Address:"
        echo "${{ steps.loclx.outputs.url }}"
        echo "========================================"

    - name: Keep workflow alive
      run: sleep infinity
