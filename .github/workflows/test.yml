name: Skyport Panel & Wings with Public Access

on:
  workflow_dispatch:

jobs:
  install:
    runs-on: ubuntu-latest

    steps:
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y curl git nodejs npm unzip

    - name: Install Skyport Panel
      run: |
        sudo bash <(curl -s https://raw.githubusercontent.com/JishnuTheGamer/skyport/refs/heads/main/panel)

    - name: Install Wings Daemon
      run: |
        sudo bash <(curl -s https://raw.githubusercontent.com/JishnuTheGamer/skyport/refs/heads/main/wings)
        cd skyportd
        echo '{}' > config.json  # Replace with actual config if needed
        sudo npm install -g pm2
        pm2 start .

    - name: Install ngrok
      run: |
        curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
        echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
        sudo apt update && sudo apt install -y ngrok

    - name: Start ngrok tunnel for port 3001
      run: |
        ngrok config add-authtoken ${{ secrets.NGROK_AUTHTOKEN }}
        nohup ngrok http 3001 > ngrok.log &
        sleep 5
        curl -s http://localhost:4040/api/tunnels > tunnels.json
        cat tunnels.json

    - name: Show public URL
      run: |
        echo "Skyport Panel public URL:"
        curl -s http://localhost:4040/api/tunnels | grep -o 'https://[^"]*'
