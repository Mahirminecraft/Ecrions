name: Minecraft Paper Server + LocalXpose

on:
  workflow_dispatch:

jobs:
  minecraft:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      LXP_TOKEN: ${{ secrets.LXP_TOKEN }}

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: temurin
        java-version: '21'

    - name: Install essential tools & LocalXpose CLI
      run: |
        sudo apt-get update -y
        sudo apt-get install -y zip unzip jq curl dnsutils
        curl -L https://api.localxpose.io/api/downloads/loclx-linux-amd64.zip -o loclx.zip
        unzip loclx.zip
        sudo mv loclx /usr/local/bin/
        sudo chmod +x /usr/local/bin/loclx

    - name: Download PaperMC Server
      run: |
        while [ ! -f paper-1.21.8-58.jar ]; do
          curl -O -L https://api.papermc.io/v2/projects/paper/versions/1.21.8/builds/58/downloads/paper-1.21.8-58.jar
          sleep 5
        done
        echo "eula=true" > eula.txt

    - name: Start Minecraft Server
      run: |
        java -Xms16G -Xmx16G -jar paper-1.21.8-58.jar nogui &
        echo $! > mc.pid

    - name: Start LocalXpose TCP Tunnel
      run: |
        export LXP_TOKEN=${{ secrets.LXP_TOKEN }}
        loclx tunnel tcp --to 25565 &
        echo $! > loclx.pid
        sleep 5
        loclx logs > loclx.log

    - name: Display Public IP:Port
      run: |
        cat loclx.log
        ADDR=$(grep -m1 -oE 'tcp://[^ ]+' loclx.log || true)
        echo "========================================"
        echo " Minecraft Server Public Address:"
        if [ -n "$ADDR" ]; then
          echo "$ADDR"
        else
          echo "❌ No TCP tunnel address found in loclx.log"
        fi
        echo "========================================"

    - name: Keep workflow alive
      run: sleep infinity
